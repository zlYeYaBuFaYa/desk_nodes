const scenes={desktop:['桌面 · 自由便签与独立工具条','在下方应用区域操作；右侧按钮仅用于切换演示状态。','点击便签建立删除目标；从标题留白拖动卡片。试试勾选、整理、收起、撤销和更多菜单。'],peek:['浮起 · 真实便签临时到最前','原生触发：工具条「浮起」或 ⌃⌥F；Esc、再按一次或切换到其他应用即放回。','便签留在原位置，不复制也不移动；在这里勾选后回桌面检查，是同一份数据。'],history:['历史记录 · 冻结的业务日快照','示例日期为 2026 年 11 月；历史数据固定，不随桌面演示编辑变化。','11 月 9–11 日包含示例快照。选择日期查看完成和顺延；月完成率按全部事项出现次数加权。'],deleted:['最近删除 · 30 天内恢复','示例删除内容与本页刚刚删除的便签／事项均可恢复；不修改固定历史。','整张恢复同时带回当次一起删除的事项；单项恢复到原便签末尾。没有永久删除操作。'],settings:['设置 · 低频原生窗口','分组、默认值与当前源码一致；系统集成动作仅展示流程说明。','工具条方向与自动收缩选项可用于桌面演示。其他设置保存在页面内存，系统动作不会执行。']};
function row(text,done=false){return {id:++sequence,text,done};}
function initial(){return {scene:'desktop',notes:[{id:1,title:'今天要做',color:'paper',x:140,y:104,fold:false,level:'desktop',items:[row('整理项目需求',true),row('确认桌面便签的交互细节'),row('完成本周的阅读计划')]},{id:2,title:'工作清单',color:'mint',x:452,y:104,fold:false,level:'desktop',items:[row('梳理数据备份与恢复流程',true),row('核对中文、数字与多行事项的对齐'),row('检查历史与最近删除入口')]},{id:3,title:'生活小事',color:'mist',x:764,y:151,fold:false,level:'topmost',items:[row('买咖啡豆'),row('给绿植浇水',true),row('周末去散步')]}],deleted:[{type:'note',at:Date.now(),note:{id:4,title:'周末计划',color:'lemon',x:140,y:340,fold:false,level:'desktop',items:[row('整理书桌'),row('去公园走走')]}}],selection:1,gathered:false,topmost:false,orientation:'vertical',shrink:15,round:false,snapped:false,toolbar:{x:24,y:108},undo:[],month:10,year:2026,day:'2026-11-11',rollover:'04:00',edge:'automatic',dock:'top',display:'main',shortcut:'Control+Option+N',login:false};}
const historyData={'2026-11-09':[{title:'今天要做',color:'paper',items:[{text:'整理项目需求',done:true},{text:'完成本周的阅读计划',done:false,carry:'11月10日'}]}],'2026-11-10':[{title:'工作清单',color:'mint',items:[{text:'梳理数据备份与恢复流程',done:true},{text:'检查历史与最近删除入口',done:false,carry:'11月11日'},{text:'旧的讨论记录',done:false,deleted:true}]}],'2026-11-11':[{title:'今天要做',color:'paper',items:[{text:'确认交互文档的范围',done:true},{text:'完成本周的阅读计划',done:false,carry:'11月12日'}]},{title:'工作清单',color:'mint',items:[{text:'检查历史与最近删除入口',done:true}]}]};
function notice(text){document.getElementById('statusText').textContent=text;}
function info(title,text){document.getElementById('dialogTitle').textContent=title;document.getElementById('dialogText').textContent=text;document.getElementById('infoDialog').showModal();}
function fitTextareas(){stage.querySelectorAll('textarea').forEach(t=>{t.style.height='32px';t.style.height=Math.max(32,t.scrollHeight)+'px';});}
function setScene(scene){clearTimeout(hoverTimer);hoverTimer=null;clearTimeout(idleTimer);state.scene=scene;closeContext();render();}
function clearTimers(){clearTimeout(hoverTimer);hoverTimer=null;clearTimeout(idleTimer);clearTimeout(toastTimer);}
function reset(){clearTimers();state=initial();sequence=Math.max(sequence,100);render();notice('已恢复示例；演示修改不写入磁盘。');}
function render(){closeContext();const meta=scenes[state.scene];document.getElementById('sceneTitle').textContent=meta[0];document.getElementById('sceneDescription').textContent=meta[1];document.getElementById('helpText').textContent=meta[2];document.querySelectorAll('[data-scene]').forEach(b=>{b.classList.toggle('active',b.dataset.scene===state.scene);b.setAttribute('aria-current',b.dataset.scene===state.scene?'page':'false');});const controls=document.getElementById('demoControls');controls.innerHTML=state.scene==='desktop'?'<span class="muted" style="font-size:11px">演示控制</span><button data-demo="orientation">'+(state.orientation==='vertical'?'切为横向':'切为竖向')+'</button><button data-demo="snap">'+(state.snapped?'恢复自由位置':'模拟吸边')+'</button><button data-demo="round" '+(!state.snapped?'disabled':'')+'>'+(state.round?'展开工具条':'立即收缩（演示）')+'</button><button data-demo="empty">切换空场景</button>':'';stage.innerHTML='<div class="menubar"><span>DeskNodes <span style="margin-left:20px">原生便签 · 场景说明</span></span><span><button data-menubar="new">新建便签</button><button data-menubar="toolbar">显示工具条</button><button data-menubar="history">历史记录</button><button data-menubar="settings">设置</button><span style="margin-left:14px">11月12日 周四</span></span></div>';
 if(state.scene==='desktop'){stage.insertAdjacentHTML('beforeend','<div class="wallpaper-caption"><strong>留一点空间，给今天。</strong>背景为原型示意，不替换用户壁纸</div>');state.notes.forEach(n=>stage.insertAdjacentHTML('beforeend',noteHTML(n)));renderToolbar();stage.insertAdjacentHTML('beforeend','<div class="native-toast" id="deleteToast"><span id="toastLabel"></span><button data-undo="yes">撤销</button></div>');updateDesk();}
 else if(state.scene==='peek'){stage.insertAdjacentHTML('beforeend','<div class="fullscreen-sample"><div class="app-line">另一款应用 · 全屏场景示意</div><h3>全屏工作时，<br>清单依然触手可及。</h3><p>按下浮起，桌面上的便签原地浮到最前；放回后回到各自层级。</p><div class="paper-line"></div><div class="paper-line"></div><div class="paper-line short"></div><p style="font-size:12px;margin-top:38px">已全部置顶时无需浮起。<br>真实窗口层级、输入法与多屏需在 macOS 验收。</p></div>'+state.notes.map(n=>noteHTML(n,true)).join(''));}
 else if(state.scene==='history')renderHistory();else if(state.scene==='deleted')renderDeleted();else if(state.scene==='settings')renderSettings();fitTextareas();armIdle();}
function noteHTML(n,lifted=false){const done=n.items.filter(i=>i.done).length,total=n.items.filter(i=>!i.struck).length;return '<article class="note '+(!lifted&&n.fold?'folded ':'')+(!lifted&&state.selection===n.id?'selected':'')+'" data-note="'+n.id+'" '+(lifted?'data-lifted="true"':'')+' style="left:'+n.x+'px;top:'+n.y+'px;background:var(--'+n.color+')"><div class="note-head"><input class="note-title" aria-label="便签标题（可选）" data-title="'+n.id+'" value="'+esc(n.fold&&!lifted?(n.title||n.items[0]?.text||''):n.title)+'" placeholder="标题" '+(n.fold&&!lifted?'readonly':'')+'><span class="note-count">'+(n.level==='topmost'?'⌁ ':'')+done+'/'+total+'</span><button class="more" data-more="'+n.id+'" aria-label="便签菜单">···</button></div><div class="note-body">'+n.items.map(i=>'<div class="item-row '+(i.done?'done':i.struck?'struck':'')+'" data-item="'+i.id+'"><button class="check" data-toggle="'+i.id+'" aria-label="'+(i.done?'取消完成':'标记完成')+'" aria-pressed="'+i.done+'"><span>'+(i.done?'✓':'')+'</span></button><textarea class="item-text" rows="1" data-text="'+i.id+'" aria-label="事项">'+esc(i.text)+'</textarea><div class="row-controls"><button class="row-action" data-strike="'+i.id+'" aria-label="'+(i.struck?'取消划掉':'划掉事项')+'" title="'+(i.struck?'取消划掉（⌘⇧X）':'划掉：不做了，但保留在便签里（⌘⇧X）')+'">'+(i.struck?'↺':'⊖')+'</button><button class="row-action row-delete" data-remove="'+i.id+'" aria-label="删除事项" title="删除事项">×</button><span class="sort-grip" draggable="true" data-sort="'+i.id+'" title="拖动排序" aria-label="拖动排序">⠿</span></div></div>').join('')+'</div><div class="note-foot"><button class="add-item" data-add="'+n.id+'">＋ 添加事项</button></div></article>';}
function renderToolbar(){const actions=[['create','新建'],['peek','浮起'],['arrange','整理'],[state.gathered?'expand':'collapse',state.gathered?'展开':'收起'],[state.topmost?'unpin':'pin',state.topmost?'取消置顶':'置顶'],['settings','设置']];stage.insertAdjacentHTML('beforeend','<aside class="native-toolbar '+(state.orientation==='horizontal'?'horizontal ':'')+(state.round?'round':'')+'" id="toolbar" aria-label="DeskNodes 工具条" style="left:'+state.toolbar.x+'px;top:'+state.toolbar.y+'px"><button class="toolbar-grip" aria-label="拖动工具条">'+icon('grip')+'</button><div class="toolbar-actions">'+actions.map((a,i)=>'<button class="tool '+(i===4&&state.topmost?'on':'')+'" data-action="'+i+'" title="'+(i===1?'临时把全部便签浮到最前，包括全屏应用':a[1])+'">'+icon(a[0])+'<span>'+a[1]+'</span></button>').join('')+'</div><div class="tool-count">'+state.notes.length+' 张便签</div><button class="round-entry" aria-label="展开 DeskNodes 工具条">'+icon('note')+'</button><span class="count-badge '+(state.gathered&&state.notes.length?'visible':'')+'">'+(state.notes.length>99?'99+':state.notes.length)+'</span></aside><button class="stack-hint '+(state.gathered&&!state.round&&state.notes.length?'show':'')+'" id="stackHint" aria-label="展开全部便签"><div class="stack-papers"><i></i><i></i><i></i></div><small>'+state.notes.length+' 张便签</small></button>');}
function updateDesk(){if(state.scene!=='desktop')return;stage.querySelectorAll('[data-note]').forEach(el=>{const id=Number(el.dataset.note);el.classList.toggle('selected',state.selection===id);el.classList.toggle('gathered',state.gathered);el.inert=state.gathered;el.style.zIndex=state.topmost||state.notes.find(n=>n.id===id)?.level==='topmost'?'6':'3';});const tools=stage.querySelectorAll('[data-action]');if(tools.length){tools[1].disabled=!state.notes.length||state.topmost;tools[2].disabled=!state.notes.length;tools[3].disabled=!state.notes.length;}const hint=document.getElementById('stackHint');if(hint){const x=state.toolbar.x+(state.orientation==='horizontal'?484:64)+12;hint.style.left=Math.min(x,stage.clientWidth-110)+'px';hint.style.top=Math.min(state.toolbar.y,550)+'px';}showUndo();}
function refreshCards(){render();}
function createNote(){state.gathered=false;const counts=palette.map(p=>state.notes.filter(n=>n.color===p[0]).length),min=Math.min(...counts);const latest=[...state.notes,...state.deleted.filter(d=>d.type==='note').map(d=>d.note)].sort((a,b)=>a.id-b.id).at(-1);const start=(palette.findIndex(p=>p[0]===latest?.color)+1)%7;let color='paper';for(let i=0;i<7;i++){const idx=(start+i)%7;if(counts[idx]===min){color=palette[idx][0];break;}}const id=++sequence;state.notes.push({id,title:'',color,x:140+(state.notes.length%3)*306,y:state.notes.length<3?104:340+(state.notes.length%3)*24,items:[row('')],fold:false,level:'desktop'});state.selection=id;state.scene='desktop';render();stage.querySelector('[data-note="'+id+'"] textarea')?.focus();notice('已新建自由便签，首条事项可以直接输入。');}
function pushDeletion(entry){entry.at=Date.now();entry.key=++sequence;state.deleted.unshift(entry);state.undo.push({key:entry.key,until:Date.now()+5000});render();notice('已删除；5 秒内撤销，之后可在最近删除恢复。');}
function deleteNote(){const index=state.notes.findIndex(n=>n.id===state.selection);if(index<0||state.gathered)return;const [note]=state.notes.splice(index,1);state.selection=null;if(!state.notes.length)state.gathered=false;pushDeletion({type:'note',note});}
function removeItem(id){const n=state.notes.find(n=>n.items.some(i=>i.id===id));if(!n)return;const index=n.items.findIndex(i=>i.id===id);const [item]=n.items.splice(index,1);if(!n.items.length)n.items.push(row(''));if(item.text.trim())pushDeletion({type:'item',item,noteID:n.id,noteTitle:n.title});else render();}
function showUndo(){clearTimeout(toastTimer);state.undo=state.undo.filter(u=>u.until>Date.now()&&state.deleted.some(d=>d.key===u.key));if(state.undo.length)toastTimer=setTimeout(showUndo,Math.max(1,Math.min(...state.undo.map(u=>u.until))-Date.now()+5));const toast=document.getElementById('deleteToast');if(!toast)return;toast.classList.toggle('show',state.undo.length>0);const d=state.deleted.find(d=>d.key===state.undo.at(-1)?.key);document.getElementById('toastLabel').textContent=state.undo.length>1?'已删除 '+state.undo.length+' 项 · 可逐项撤销':d?.type==='item'?'已删除事项':'已删除便签';}
function restore(entry){if(!entry)return;if(entry.type==='note'){state.notes.push(entry.note);state.gathered=false;state.selection=entry.note.id;}else{const parent=state.notes.find(n=>n.id===entry.noteID);if(!parent){info('请先恢复所属便签','事项必须恢复到原便签，请先恢复已删除的便签。');return;}parent.items.push(entry.item);}state.deleted=state.deleted.filter(d=>d!==entry);state.undo=state.undo.filter(u=>u.key!==entry.key);render();notice('已恢复 live 数据；示例封存历史没有变化。');}
function undoDelete(){showUndo();const last=state.undo.at(-1);if(last)restore(state.deleted.find(d=>d.key===last.key));}
function arrange(){state.gathered=false;state.notes.forEach((n,i)=>{n.x=140+(i%3)*306;n.y=80+Math.floor(i/3)*270;});render();notice('演示按三列整理。原生应用按实际屏幕求布局并在超容量时分页；本页不模拟完整分页。');}
function toggleGather(){if(!state.notes.length)return;state.gathered=!state.gathered;render();notice(state.gathered?'已收起整组便签，单张折叠与位置均保留。':'已按原位置展开，没有触发整理。');}
function setRound(round){if(round&&!state.snapped)return;clearTimeout(idleTimer);state.round=round;render();notice(round?'工具条已收缩；悬停 140ms 或单击展开，不改变便签状态。':'工具条已展开；便签收起状态独立。');}
function armIdle(){clearTimeout(idleTimer);if(state.scene!=='desktop'||!state.snapped||state.round||!state.shrink)return;idleTimer=setTimeout(()=>{const t=document.getElementById('toolbar');if(t?.matches(':hover'))armIdle();else setRound(true);},state.hoverOpened?1500:state.shrink*1000);}
function bar(title,switcher=false){return '<div class="window-bar"><div class="traffic" aria-hidden="true"><i></i><i></i><i></i></div><span class="window-title">'+title+'</span>'+(switcher?'<div class="segmented"><button data-mode="history" class="'+(state.scene==='history'?'active':'')+'">日历</button><button data-mode="deleted" class="'+(state.scene==='deleted'?'active':'')+'">最近删除</button></div>':'<span style="width:58px"></span>')+'</div>';}
function completion(groups){const items=groups.flatMap(g=>g.items),done=items.filter(i=>i.done).length;return {done,total:items.length,percent:items.length?Math.round(done/items.length*100)+'%':'—'};}
function renderHistory(){const first=new Date(Date.UTC(state.year,state.month,1)),days=new Date(Date.UTC(state.year,state.month+1,0)).getUTCDate(),offset=(first.getUTCDay()+6)%7;const key=d=>state.year+'-'+String(state.month+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');const prefix=key(1).slice(0,7),monthly=completion(Object.entries(historyData).filter(([d])=>d.startsWith(prefix)).flatMap(([,g])=>g)),daily=historyData[state.day],c=completion(daily||[]);let cells='<div class="calendar-grid">'+['一','二','三','四','五','六','日'].map(d=>'<span class="weekday">'+d+'</span>').join('')+Array(offset).fill('<span></span>').join('');for(let d=1;d<=days;d++){const date=key(d),data=historyData[date],v=completion(data||[]);cells+='<button class="day '+(date===state.day?'chosen ':'')+(date==='2026-11-12'?'today ':'')+(!data?'no-data':'')+'" data-day="'+date+'" aria-label="'+date+' '+(data?'完成 '+v.done+'/'+v.total:'无历史记录')+'">'+d+(v.total?'<span class="day-track"><i style="width:'+v.percent+'"></i></span>':'')+'</button>';}cells+='</div>';stage.insertAdjacentHTML('beforeend','<section class="native-window history-window">'+bar('历史记录',true)+'<div class="history-main"><aside class="calendar-panel"><div class="month-head"><h3>'+state.year+'年'+(state.month+1)+'月</h3><div class="month-arrows"><button data-month="-1" aria-label="上个月">‹</button><button data-month="1" aria-label="下个月">›</button></div></div>'+cells+'<div class="month-summary">本月完成率<strong>'+monthly.percent+'</strong>共 '+monthly.total+' 项，完成 '+monthly.done+' 项<br><small>固定示例快照 · 11月9–11日</small></div></aside><div class="day-detail"><div class="detail-top"><h3>'+Number(state.day.slice(5,7))+'月'+Number(state.day.slice(8))+'日</h3><span class="muted">完成 '+c.done+' / '+c.total+'</span></div>'+(daily?daily.map(g=>'<section class="history-group"><h4><span class="dot" style="background:var(--'+g.color+')"></span>'+esc(g.title)+'</h4>'+g.items.map(i=>'<div class="history-row '+(i.deleted?'deleted':'')+'"><span class="muted">'+(i.done?'●':'○')+'</span><span>'+esc(i.text)+'</span>'+(i.deleted?'<small class="badge">已删除</small>':i.carry?'<small class="badge carry">顺延到 '+i.carry+'</small>':'')+'</div>').join('')+'</section>').join(''):'<p class="muted">当天没有历史记录</p><p class="muted" style="font-size:12px">每日结束后保存快照；未记录的日期不会补造数据。</p>')+'</div></div></section>');}
function renderDeleted(){const notes=state.deleted.filter(d=>d.type==='note'),items=state.deleted.filter(d=>d.type==='item');function card(d){const n=d.type==='note'?d.note:state.notes.find(n=>n.id===d.noteID);return '<article class="deleted-card" style="background:var(--'+(n?.color||'paper')+')"><div class="deleted-card-head"><h4>'+esc(d.type==='note'?(d.note.title||d.note.items[0]?.text||'无标题便签'):d.item.text)+'</h4><button data-restore="'+state.deleted.indexOf(d)+'">恢复</button></div><p class="deleted-meta">删除于 '+(d.key?'本次演示':'示例时间')+' · 30 天后移出列表'+(d.type==='item'?' · 来自「'+esc(d.noteTitle||'无标题便签')+'」':'')+'</p>'+(d.type==='note'?'<div class="deleted-preview">'+d.note.items.slice(0,4).map(i=>'<div>'+(i.done?'● ':'○ ')+esc(i.text)+'</div>').join('')+'</div>':'')+'</article>';}
 stage.insertAdjacentHTML('beforeend','<section class="native-window history-window">'+bar('历史记录',true)+'<div class="deleted-main"><h3>最近删除</h3><p class="muted" style="font-size:12px;margin:0">删除的便签和事项保留 30 天，可随时恢复；历史记录中的快照不受影响。</p>'+(notes.length?'<section class="deleted-section"><span class="muted">便签 · '+notes.length+'</span>'+notes.map(card).join('')+'</section>':'')+(items.length?'<section class="deleted-section"><span class="muted">事项 · '+items.length+'</span>'+items.map(card).join('')+'</section>':'')+(!notes.length&&!items.length?'<div class="empty">最近 30 天没有删除的内容</div>':'')+'</div></section>');}
function segments(name,choices,value){return '<div class="segmented">'+choices.map(([v,label])=>'<button data-setting="'+name+'" data-value="'+v+'" class="'+(String(value)===String(v)?'active':'')+'">'+label+'</button>').join('')+'</div>';}
function settingGroup(title,rows,help=''){return '<section class="setting-group"><h4>'+title+'</h4><div class="setting-box">'+rows.map(([title,control])=>'<div class="setting-row"><span>'+title+'</span>'+control+'</div>').join('')+'</div>'+(help?'<p class="setting-help">'+help+'</p>':'')+'</section>';}
function renderSettings(){stage.insertAdjacentHTML('beforeend','<section class="native-window settings-window">'+bar('设置')+'<div class="settings-body">'+settingGroup('通用',[['开机时自动启动','<input type="checkbox" aria-label="开机时自动启动" id="loginSetting" '+(state.login?'checked':'')+'>'],['每天跨天时间','<input type="time" id="rolloverSetting" aria-label="每天跨天时间" value="'+state.rollover+'">']],'未注册（演示）。跨天范围 00:00–23:59，默认 04:00。<br><a href="#" data-system="login">在系统设置中查看登录项…</a>')+settingGroup('停靠条',[['停靠位置',segments('dock',[['top','顶部'],['left','左侧'],['right','右侧']],state.dock)],['显示在','<select id="displaySetting" aria-label="停靠显示器"><option>主显示器</option></select>']])+settingGroup('工具条',[['排列方向',segments('orientation',[['vertical','竖向'],['horizontal','横向']],state.orientation)],['吸边后自动收缩',segments('shrink',[[0,'关闭'],[10,'10 秒'],[15,'15 秒'],[30,'30 秒']],state.shrink)]],'自由摆放不收缩；拖到外侧边缘吸附后才开始闲置计时。')+settingGroup('快捷键',[['新建便签','<span style="font-variant-numeric:tabular-nums">'+esc(state.shortcut.replaceAll('Control+','⌃').replaceAll('Option+','⌥').replaceAll('Command+','⌘').replaceAll('Shift+','⇧'))+'</span><button data-system="hotkey">录制…</button>'],['浮起便签','<span style="font-variant-numeric:tabular-nums">⌃⌥F</span><button data-system="hotkey">录制…</button>']],'浮起：把全部便签临时浮到最前，包括全屏应用；Esc、再按一次或切换应用即放回。')+settingGroup('数据',[['备份（JSON）','<div><button data-system="import">导入…</button> <button data-system="export">导出…</button></div>']],'native backup v1 / schema 8（可导入 schema 7）；本页按钮仅解释流程，不读写真实文件。')+'</div></section>');}
function closeContext(){context?.remove();context=null;}
function openMenu(id,button){closeContext();const n=state.notes.find(n=>n.id===id);if(!n)return;const rect=button.getBoundingClientRect(),bounds=stage.getBoundingClientRect();context=document.createElement('div');context.className='context-menu';context.setAttribute('role','menu');context.innerHTML='<div style="font-size:11px;padding:5px 9px;color:var(--sub)">颜色 · 七色</div><div class="swatches">'+palette.map(([color,name])=>'<button class="swatch" data-color="'+color+'" data-target="'+id+'" style="background:var(--'+color+')" title="'+name+'" aria-label="'+name+'"></button>').join('')+'</div><hr>'+['desktop','ordinary','topmost'].map((level,i)=>'<button data-level="'+level+'" data-target="'+id+'">'+(n.level===level?'✓ ':'　 ')+['桌面层','普通','置顶'][i]+'</button>').join('')+'<hr>'+['顶部','左侧','右侧','移出停靠条'].map(label=>'<button data-dock-info="yes">'+(label==='移出停靠条'?label:'停靠到'+label)+'</button>').join('')+'<hr><button data-fold="'+id+'">'+(n.fold?'展开':'折叠')+'</button><button data-auto-height="yes">随内容调整高度</button><button data-add="'+id+'">添加事项</button><button class="danger" data-delete-note="'+id+'">删除便签</button>';context.style.left=Math.max(0,Math.min(rect.left-bounds.left,stage.clientWidth-245))+'px';context.style.top=Math.max(30,Math.min(rect.bottom-bounds.top,stage.clientHeight-455))+'px';stage.appendChild(context);}
function focusItem(id){requestAnimationFrame(()=>stage.querySelector('[data-text="'+id+'"]')?.focus());}
function appendItem(noteID,after){const n=state.notes.find(n=>n.id===noteID);if(!n)return;const i=row(''),at=after?n.items.findIndex(i=>i.id===after)+1:n.items.length;n.items.splice(at,0,i);render();focusItem(i.id);}
document.getElementById('brandMark').innerHTML=icon('note');
document.getElementById('themeToggle').onclick=()=>{const dark=document.body.classList.toggle('dark');document.getElementById('themeToggle').textContent=dark?'浅色模式':'深色模式';};
document.getElementById('resetDemo').onclick=reset;document.getElementById('dialogClose').onclick=()=>document.getElementById('infoDialog').close();
document.querySelector('.doc-nav').onclick=e=>{const b=e.target.closest('[data-scene]');if(b)setScene(b.dataset.scene);};
document.getElementById('demoControls').onclick=e=>{const b=e.target.closest('[data-demo]');if(!b)return;state.hoverOpened=false;if(b.dataset.demo==='orientation'){state.orientation=state.orientation==='vertical'?'horizontal':'vertical';render();}else if(b.dataset.demo==='snap'){state.snapped=!state.snapped;state.round=false;state.toolbar.x=state.snapped?8:24;render();notice(state.snapped?'演示已吸附左边缘；闲置后自动收缩。':'已恢复自由位置，不再自动收缩。');}else if(b.dataset.demo==='round')setRound(!state.round);else if(b.dataset.demo==='empty'){state.notes=[];state.selection=null;state.gathered=false;render();notice('空场景：新建、置顶、设置仍可用；恢复示例可回到初始数据。');}};
stage.addEventListener('click',e=>{const b=e.target.closest('button,a');if(!b){if(!e.target.closest('.context-menu'))closeContext();return;}if(b.dataset.action!==undefined){state.hoverOpened=false;const a=Number(b.dataset.action);if(a===0)createNote();else if(a===1)setScene('peek');else if(a===2)arrange();else if(a===3)toggleGather();else if(a===4){state.topmost=!state.topmost;render();notice(state.topmost?'全局置顶已开启；演示层级，无原生全屏能力。':'关闭全局置顶，恢复各自保存层级。');}else setScene('settings');return;}if(b.closest('.round-entry')){state.hoverOpened=false;setRound(false);return;}if(b.closest('#stackHint')){toggleGather();return;}if(b.dataset.undo){undoDelete();return;}if(b.dataset.menubar){const a=b.dataset.menubar;if(a==='new')createNote();else if(a==='toolbar'){state.round=false;setScene('desktop');}else setScene(a);return;}if(b.dataset.toggle){const id=Number(b.dataset.toggle),n=state.notes.find(n=>n.items.some(i=>i.id===id));if(n){const i=n.items.find(i=>i.id===id);i.done=!i.done;i.struck=false;render();}return;}if(b.dataset.strike){const id=Number(b.dataset.strike),n=state.notes.find(n=>n.items.some(i=>i.id===id));if(n){const i=n.items.find(i=>i.id===id);i.struck=!i.struck;i.done=false;render();}return;}if(b.dataset.remove){removeItem(Number(b.dataset.remove));return;}if(b.dataset.add){appendItem(Number(b.dataset.add));return;}if(b.dataset.more){openMenu(Number(b.dataset.more),b);return;}if(b.dataset.color||b.dataset.level){const n=state.notes.find(n=>n.id===Number(b.dataset.target));if(n){if(b.dataset.color)n.color=b.dataset.color;if(b.dataset.level)n.level=b.dataset.level;}render();return;}if(b.dataset.fold){const n=state.notes.find(n=>n.id===Number(b.dataset.fold));if(n)n.fold=!n.fold;render();return;}if(b.dataset.deleteNote){state.selection=Number(b.dataset.deleteNote);deleteNote();return;}if(b.dataset.dockInfo){closeContext();info('原生兼容停靠入口','当前源码保留顶部、左侧、右侧停靠和移出停靠条。浏览器说明模型不模拟完整停靠、溢出标签与多屏布局；请按 UI_SPEC.md 和原生验收清单检查。');return;}if(b.dataset.autoHeight){closeContext();info('随内容调整高度','原生便签恢复 automaticHeight，按内容增长，最高 480pt。说明模型始终按内容排版，不模拟手动缩放。');return;}if(b.dataset.mode){setScene(b.dataset.mode);return;}if(b.dataset.day){state.day=b.dataset.day;render();return;}if(b.dataset.month){const d=new Date(Date.UTC(state.year,state.month+Number(b.dataset.month),1));state.year=d.getUTCFullYear();state.month=d.getUTCMonth();state.day=state.year+'-'+String(state.month+1).padStart(2,'0')+'-01';render();return;}if(b.dataset.restore!==undefined){restore(state.deleted[Number(b.dataset.restore)]);return;}if(b.dataset.setting){state[b.dataset.setting]=b.dataset.setting==='shrink'?Number(b.dataset.value):b.dataset.value;if(b.dataset.setting==='shrink'&&!state.shrink)state.round=false;render();return;}if(b.dataset.system){e.preventDefault();const name=b.dataset.system;const messages={login:['系统登录项','原生应用由明确操作调用 SMAppService；以系统返回的启用、待批准、未注册等状态为准。此说明模型不会注册或打开系统设置。'],hotkey:['录制新建快捷键','原生应用录制下一次键盘组合，Esc 取消。支持 Control 或 Command 加物理字母、数字、Space；系统保留组合和冲突拒绝，保留旧绑定。本页不捕获全局快捷键。'],import:['导入完整备份','原生流程：选 JSON → 校验 native v1/schema 7 与完整引用 → 构建 staging 数据库 → 确认替换全部业务数据 → 候选热键成功后原子替库 → 清理旧编辑与撤销。本机工具条和全局展示偏好保持；本页不导入文件。'],export:['导出完整备份','原生流程：完成输入法组词 → 提交有效编辑 → 事务读取便签、事项、历史、设置与检查点 → 保存 JSON。工具条、本机展示偏好、系统登录注册和临时撤销不导出。本页不生成伪造备份。']};info(...messages[name]);return;}if(!b.closest('.context-menu'))closeContext();});
stage.addEventListener('input',e=>{if(e.target.dataset.text){const id=Number(e.target.dataset.text);const i=state.notes.flatMap(n=>n.items).find(i=>i.id===id);if(i)i.text=e.target.value;fitTextareas();}if(e.target.dataset.title){const n=state.notes.find(n=>n.id===Number(e.target.dataset.title));if(n)n.title=e.target.value;}if(e.target.id==='rolloverSetting')state.rollover=e.target.value;});
stage.addEventListener('change',e=>{if(e.target.id==='loginSetting'){state.login=false;e.target.checked=false;info('登录启动由系统确认','原生应用会保存用户意愿并请求系统服务。本页只说明流程，不模拟已启用状态。');}});
stage.addEventListener('keydown',e=>{const t=e.target;if(t.dataset.text&&!e.isComposing){const id=Number(t.dataset.text),n=state.notes.find(n=>n.items.some(i=>i.id===id));if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)){e.preventDefault();const i=n.items.find(i=>i.id===id);i.done=!i.done;i.struck=false;render();focusItem(id);}else if((e.key==='x'||e.key==='X')&&e.metaKey&&e.shiftKey){e.preventDefault();const i=n.items.find(i=>i.id===id);i.struck=!i.struck;i.done=false;render();focusItem(id);}else if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();appendItem(n.id,id);}else if(e.key==='Backspace'&&!t.value){e.preventDefault();removeItem(id);}}if(e.key==='Escape')closeContext();});
stage.addEventListener('paste',e=>{const t=e.target;if(!t.dataset.text)return;const raw=e.clipboardData?.getData('text/plain');if(!raw||!raw.includes('\n'))return;const lines=raw.split(/\r?\n/).map(s=>s.trim().replace(/^(?:- \[[ xX]\] |[-*•] |\d+\. )/, '').trim()).filter(Boolean);if(lines.length<2)return;e.preventDefault();const id=Number(t.dataset.text),n=state.notes.find(n=>n.items.some(i=>i.id===id)),i=n.items.find(i=>i.id===id);i.text=t.value.slice(0,t.selectionStart)+lines[0]+t.value.slice(t.selectionEnd);const at=n.items.findIndex(i=>i.id===id);const added=lines.slice(1).map(text=>row(text));n.items.splice(at+1,0,...added);render();focusItem(added.at(-1).id);});
// Dragging is deliberately scoped to the prototype's single desktop canvas.
stage.addEventListener('pointerdown',e=>{const note=e.target.closest('[data-note]');if(note&&!note.dataset.lifted){state.selection=Number(note.dataset.note);updateDesk();}const grip=e.target.closest('.toolbar-grip,.round-entry'),head=e.target.closest('.note-head');if(!grip&&(!head||e.target.closest('input,button')||note?.dataset.lifted))return;if(e.button!==0)return;const target=grip?document.getElementById('toolbar'):note;const model=grip?state.toolbar:state.notes.find(n=>n.id===Number(note.dataset.note));const x=e.clientX,y=e.clientY,ox=model.x,oy=model.y;let moved=false;clearTimeout(idleTimer);target.classList.add('dragging');target.setPointerCapture(e.pointerId);function move(ev){const dx=ev.clientX-x,dy=ev.clientY-y;if(Math.max(Math.abs(dx),Math.abs(dy))>=4)moved=true;if(!moved)return;model.x=Math.max(grip?8:0,Math.min(stage.clientWidth-target.offsetWidth-8,ox+dx));model.y=Math.max(30,Math.min(stage.clientHeight-target.offsetHeight-8,oy+dy));target.style.left=model.x+'px';target.style.top=model.y+'px';}function up(ev){target.removeEventListener('pointermove',move);target.removeEventListener('pointerup',up);target.classList.remove('dragging');target.releasePointerCapture(ev.pointerId);if(grip&&moved){state.snapped=model.x<=81;if(state.snapped)model.x=8;state.round=false;state.hoverOpened=false;render();notice('演示拖动仅简化左边缘吸附；四边锚点和多屏规则见交互文档。');}else if(moved){updateDesk();notice('便签已自由移动，不自动进入旧停靠模式。');}}target.addEventListener('pointermove',move);target.addEventListener('pointerup',up);});
stage.addEventListener('pointerover',e=>{const t=e.target.closest('#toolbar');if(!t)return;clearTimeout(idleTimer);if(state.round&&!hoverTimer&&e.buttons===0)hoverTimer=setTimeout(()=>{hoverTimer=null;if(document.getElementById('toolbar')?.matches(':hover')){state.hoverOpened=true;setRound(false);}},140);});
stage.addEventListener('pointerout',e=>{if(e.target.closest('#toolbar')&&!e.relatedTarget?.closest?.('#toolbar')){clearTimeout(hoverTimer);hoverTimer=null;armIdle();}});
stage.addEventListener('wheel',e=>{if(e.target.closest('#toolbar')){state.hoverOpened=false;armIdle();}},{passive:true});
stage.addEventListener('dragstart',e=>{const g=e.target.closest('[data-sort]');if(!g)return;const n=e.target.closest('[data-note]');dragItem={note:Number(n.dataset.note),item:Number(g.dataset.sort)};e.dataTransfer.setData('text/plain',String(g.dataset.sort));e.dataTransfer.effectAllowed='move';});
stage.addEventListener('dragover',e=>{if(dragItem&&e.target.closest('[data-item]'))e.preventDefault();});
stage.addEventListener('drop',e=>{const r=e.target.closest('[data-item]'),n=e.target.closest('[data-note]');if(!r||!n||!dragItem)return;e.preventDefault();if(Number(n.dataset.note)!==dragItem.note){notice('事项仅支持同一便签内排序。');dragItem=null;return;}const note=state.notes.find(n=>n.id===dragItem.note),from=note.items.findIndex(i=>i.id===dragItem.item),to=note.items.findIndex(i=>i.id===Number(r.dataset.item));const [item]=note.items.splice(from,1);note.items.splice(to,0,item);dragItem=null;render();});
stage.addEventListener('dragend',()=>{dragItem=null;});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeContext();});
reset();
</script>
