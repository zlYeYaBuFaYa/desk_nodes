<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>便签状态与菜单</title>
<style>
body{margin:0}
a{color:#3A5A78}a:hover{color:#24405A}
</style>
<style>body{background:#DDDAD4;display:flex;justify-content:center;padding:24px}</style>
</head>
<body>


<div style="width: 1440px; height: 900px; box-sizing: border-box; padding: 40px; background: #E9E7E2; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif; -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; gap: 44px">

<div style="display: flex; gap: 40px; align-items: flex-start">

<div style="width: 240px; display: flex; flex-direction: column; gap: 12px">
<span style="font-size: 12px; font-weight: 600; color: #4D4A44">默认</span>
<section aria-label="便签 默认状态" style="box-sizing: border-box; padding: 14px; border-radius: 12px; background: #F6F1E7; border: 1px solid rgba(0,0,0,0.06); box-shadow: 0 1px 2px rgba(0,0,0,0.06), 0 8px 24px rgba(0,0,0,0.10)">
<div style="display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 8px"><h2 style="margin: 0; font-size: 13px; font-weight: 600; color: #1F1F1F">今天</h2><span style="font-size: 11px; color: #5F5A52; font-variant-numeric: tabular-nums">1 / 3</span></div>
<div style="display: flex; align-items: center; gap: 9px; height: 26px"><button aria-label="取消完成" style="flex: none; width: 16px; height: 16px; padding: 0; border: none; border-radius: 50%; background: rgba(31,31,31,0.72); display: flex; align-items: center; justify-content: center"><svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 5.2l2 2 4-4.4" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg></button><span style="font-size: 13px; color: #6F6A61; text-decoration: line-through">回复评审邮件</span></div>
<div style="display: flex; align-items: center; gap: 9px; height: 26px"><button aria-label="标记完成" style="flex: none; width: 16px; height: 16px; padding: 0; border: 1.5px solid rgba(31,31,31,0.42); border-radius: 50%; background: transparent"></button><span style="font-size: 13px; color: #1F1F1F">确认周会议程</span></div>
<div style="display: flex; align-items: center; gap: 9px; height: 26px"><button aria-label="标记完成" style="flex: none; width: 16px; height: 16px; padding: 0; border: 1.5px solid rgba(31,31,31,0.42); border-radius: 50%; background: transparent"></button><span style="font-size: 13px; color: #1F1F1F">取快递</span></div>
</section>
</div>

<div style="width: 240px; display: flex; flex-direction: column; gap: 12px">
<span style="font-size: 12px; font-weight: 600; color: #4D4A44">悬停：浮出工具条</span>
<section aria-label="便签 悬停状态" style="position: relative; box-sizing: border-box; padding: 14px; border-radius: 12px; background: #F6F1E7; border: 1px solid rgba(0,0,0,0.10); box-shadow: 0 1px 2px rgba(0,0,0,0.08), 0 12px 30px rgba(0,0,0,0.14)">
<div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px">
<h2 style="margin: 0; font-size: 13px; font-weight: 600; color: #1F1F1F">今天</h2>
<div style="display: flex; gap: 2px">
<button aria-label="更换颜色" style="width: 24px; height: 24px; padding: 0; border: none; border-radius: 6px; background: transparent; display: flex; align-items: center; justify-content: center"><span style="width: 12px; height: 12px; border-radius: 6px; background: #F6F1E7; box-shadow: 0 0 0 1.5px #5F5A52"></span></button>
<button aria-label="置顶" style="width: 24px; height: 24px; padding: 0; border: none; border-radius: 6px; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="13" height="13" viewBox="0 0 12 12" aria-hidden="true"><path d="M4.2 1.5h3.6l-.6 3.2 1.8 1.6H3l1.8-1.6z M6 6.3v4.2" fill="none" stroke="#3F3B35" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"></path></svg></button>
<button aria-label="折叠" style="width: 24px; height: 24px; padding: 0; border: none; border-radius: 6px; background: rgba(0,0,0,0.06); display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 7.5L6 4.5l3 3" fill="none" stroke="#3F3B35" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
<button aria-label="更多" style="width: 24px; height: 24px; padding: 0; border: none; border-radius: 6px; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><circle cx="3" cy="7" r="1.2" fill="#3F3B35"></circle><circle cx="7" cy="7" r="1.2" fill="#3F3B35"></circle><circle cx="11" cy="7" r="1.2" fill="#3F3B35"></circle></svg></button>
</div>
</div>
<div style="display: flex; align-items: center; gap: 9px; height: 26px"><button aria-label="取消完成" style="flex: none; width: 16px; height: 16px; padding: 0; border: none; border-radius: 50%; background: rgba(31,31,31,0.72); display: flex; align-items: center; justify-content: center"><svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 5.2l2 2 4-4.4" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg></button><span style="font-size: 13px; color: #6F6A61; text-decoration: line-through">回复评审邮件</span></div>
<div style="display: flex; align-items: center; gap: 9px; height: 26px; margin: 0 -6px; padding: 0 6px; border-radius: 6px; background: rgba(0,0,0,0.045)"><button aria-label="标记完成" style="flex: none; width: 16px; height: 16px; padding: 0; border: 1.5px solid rgba(31,31,31,0.6); border-radius: 50%; background: transparent"></button><span style="flex: 1; font-size: 13px; color: #1F1F1F">确认周会议程</span><svg width="10" height="14" viewBox="0 0 10 14" role="img" aria-label="拖动排序"><circle cx="3" cy="3" r="1.1" fill="#6F6A61"></circle><circle cx="7" cy="3" r="1.1" fill="#6F6A61"></circle><circle cx="3" cy="7" r="1.1" fill="#6F6A61"></circle><circle cx="7" cy="7" r="1.1" fill="#6F6A61"></circle><circle cx="3" cy="11" r="1.1" fill="#6F6A61"></circle><circle cx="7" cy="11" r="1.1" fill="#6F6A61"></circle></svg></div>
<div style="display: flex; align-items: center; gap: 9px; height: 26px"><button aria-label="标记完成" style="flex: none; width: 16px; height: 16px; padding: 0; border: 1.5px solid rgba(31,31,31,0.42); border-radius: 50%; background: transparent"></button><span style="font-size: 13px; color: #1F1F1F">取快递</span></div>
<div style="position: absolute; right: 2px; bottom: 2px; width: 10px; height: 10px; border-right: 1.5px solid rgba(0,0,0,0.25); border-bottom: 1.5px solid rgba(0,0,0,0.25); border-bottom-right-radius: 8px"></div>
</section>
</div>

<div style="width: 240px; display: flex; flex-direction: column; gap: 12px">
<span style="font-size: 12px; font-weight: 600; color: #4D4A44">编辑：回车新增一行</span>
<section aria-label="便签 编辑状态" style="box-sizing: border-box; padding: 14px; border-radius: 12px; background: #F6F1E7; border: 1px solid rgba(0,0,0,0.10); box-shadow: 0 1px 2px rgba(0,0,0,0.08), 0 12px 30px rgba(0,0,0,0.14)">
<div style="display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 8px"><h2 style="margin: 0; font-size: 13px; font-weight: 600; color: #1F1F1F">今天</h2><span style="font-size: 11px; color: #5F5A52; font-variant-numeric: tabular-nums">1 / 4</span></div>
<div style="display: flex; align-items: center; gap: 9px; height: 26px"><button aria-label="取消完成" style="flex: none; width: 16px; height: 16px; padding: 0; border: none; border-radius: 50%; background: rgba(31,31,31,0.72); display: flex; align-items: center; justify-content: center"><svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 5.2l2 2 4-4.4" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg></button><span style="font-size: 13px; color: #6F6A61; text-decoration: line-through">回复评审邮件</span></div>
<div style="display: flex; align-items: center; gap: 9px; height: 26px"><button aria-label="标记完成" style="flex: none; width: 16px; height: 16px; padding: 0; border: 1.5px solid rgba(31,31,31,0.42); border-radius: 50%; background: transparent"></button><span style="font-size: 13px; color: #1F1F1F">确认周会议程</span></div>
<div style="display: flex; align-items: center; gap: 9px; height: 26px"><button aria-label="标记完成" style="flex: none; width: 16px; height: 16px; padding: 0; border: 1.5px solid rgba(31,31,31,0.42); border-radius: 50%; background: transparent"></button><span style="font-size: 13px; color: #1F1F1F">取快递</span></div>
<div style="display: flex; align-items: center; gap: 9px; height: 26px"><span style="flex: none; width: 16px; height: 16px; box-sizing: border-box; border: 1.5px dashed rgba(31,31,31,0.42); border-radius: 50%"></span><label style="flex: 1; display: flex"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">新事项</span><input type="text" value="买花" style="flex: 1; min-width: 0; padding: 0; border: none; outline: none; background: transparent; font: inherit; font-size: 13px; color: #1F1F1F; caret-color: #1F1F1F"></label></div>
</section>
</div>

<div style="width: 240px; display: flex; flex-direction: column; gap: 12px">
<span style="font-size: 12px; font-weight: 600; color: #4D4A44">折叠</span>
<section aria-label="便签 折叠状态" style="height: 32px; box-sizing: border-box; padding: 0 12px; border-radius: 10px; background: #F6F1E7; border: 1px solid rgba(0,0,0,0.06); box-shadow: 0 1px 2px rgba(0,0,0,0.06), 0 6px 16px rgba(0,0,0,0.10); display: flex; align-items: center; justify-content: space-between">
<h2 style="margin: 0; font-size: 13px; font-weight: 600; color: #1F1F1F">今天</h2>
<span style="font-size: 11px; color: #5F5A52; font-variant-numeric: tabular-nums">1 / 3</span>
</section>
<section aria-label="便签 无标题折叠" style="height: 32px; box-sizing: border-box; padding: 0 12px; border-radius: 10px; background: #E3ECF5; border: 1px solid rgba(0,0,0,0.06); box-shadow: 0 1px 2px rgba(0,0,0,0.06), 0 6px 16px rgba(0,0,0,0.10); display: flex; align-items: center; justify-content: space-between">
<span style="font-size: 13px; color: #1F1F1F">提交周报</span>
<span style="font-size: 11px; color: #4A5664; font-variant-numeric: tabular-nums">2 / 5</span>
</section>
<span style="font-size: 12px; color: #5C5952; line-height: 1.5">没有标题时显示第一条事项</span>
</div>

<div style="width: 240px; display: flex; flex-direction: column; gap: 12px">
<span style="font-size: 12px; font-weight: 600; color: #4D4A44">深色模式</span>
<section aria-label="便签 深色模式" style="box-sizing: border-box; padding: 14px; border-radius: 12px; background: #2B2822; border: 1px solid rgba(255,255,255,0.08); box-shadow: 0 1px 2px rgba(0,0,0,0.2), 0 8px 24px rgba(0,0,0,0.25)">
<div style="display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 8px"><h2 style="margin: 0; font-size: 13px; font-weight: 600; color: #EDEBE6">今天</h2><span style="font-size: 11px; color: #B3ADA2; font-variant-numeric: tabular-nums">1 / 3</span></div>
<div style="display: flex; align-items: center; gap: 9px; height: 26px"><button aria-label="取消完成" style="flex: none; width: 16px; height: 16px; padding: 0; border: none; border-radius: 50%; background: rgba(237,235,230,0.8); display: flex; align-items: center; justify-content: center"><svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 5.2l2 2 4-4.4" fill="none" stroke="#2B2822" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg></button><span style="font-size: 13px; color: #A39D92; text-decoration: line-through">回复评审邮件</span></div>
<div style="display: flex; align-items: center; gap: 9px; height: 26px"><button aria-label="标记完成" style="flex: none; width: 16px; height: 16px; padding: 0; border: 1.5px solid rgba(237,235,230,0.5); border-radius: 50%; background: transparent"></button><span style="font-size: 13px; color: #EDEBE6">确认周会议程</span></div>
<div style="display: flex; align-items: center; gap: 9px; height: 26px"><button aria-label="标记完成" style="flex: none; width: 16px; height: 16px; padding: 0; border: 1.5px solid rgba(237,235,230,0.5); border-radius: 50%; background: transparent"></button><span style="font-size: 13px; color: #EDEBE6">取快递</span></div>
</section>
</div>
</div>

<div style="display: flex; gap: 40px; align-items: flex-start">

<div style="width: 240px; display: flex; flex-direction: column; gap: 12px">
<span style="font-size: 12px; font-weight: 600; color: #4D4A44">右键菜单</span>
<div role="menu" aria-label="便签菜单" style="box-sizing: border-box; padding: 6px; border-radius: 10px; background: #FBFBFA; box-shadow: 0 0 0 1px rgba(0,0,0,0.10), 0 12px 32px rgba(0,0,0,0.18); display: flex; flex-direction: column">
<span style="padding: 6px 10px 4px; font-size: 11px; color: #5C5952">颜色</span>
<div style="display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 4px; padding: 2px 8px 8px">
<button aria-label="宣纸（当前）" style="width: 20px; height: 20px; padding: 0; border-radius: 10px; border: none; background: #F6F1E7; box-shadow: 0 0 0 1px rgba(0,0,0,0.15), 0 0 0 3px #FBFBFA, 0 0 0 4.5px #3F3B35"></button>
<button aria-label="柠黄" style="width: 20px; height: 20px; padding: 0; border-radius: 10px; border: none; background: #FAF0C8; box-shadow: 0 0 0 1px rgba(0,0,0,0.15)"></button>
<button aria-label="杏" style="width: 20px; height: 20px; padding: 0; border-radius: 10px; border: none; background: #FBE7D6; box-shadow: 0 0 0 1px rgba(0,0,0,0.15)"></button>
<button aria-label="樱" style="width: 20px; height: 20px; padding: 0; border-radius: 10px; border: none; background: #F7E1E4; box-shadow: 0 0 0 1px rgba(0,0,0,0.15)"></button>
<button aria-label="薰衣草" style="width: 20px; height: 20px; padding: 0; border-radius: 10px; border: none; background: #ECE6F5; box-shadow: 0 0 0 1px rgba(0,0,0,0.15)"></button>
<button aria-label="雾蓝" style="width: 20px; height: 20px; padding: 0; border-radius: 10px; border: none; background: #E3ECF5; box-shadow: 0 0 0 1px rgba(0,0,0,0.15)"></button>
<button aria-label="薄荷" style="width: 20px; height: 20px; padding: 0; border-radius: 10px; border: none; background: #E2F0E8; box-shadow: 0 0 0 1px rgba(0,0,0,0.15)"></button>
<button aria-label="石墨" style="width: 20px; height: 20px; padding: 0; border-radius: 10px; border: none; background: #E8E8EA; box-shadow: 0 0 0 1px rgba(0,0,0,0.15)"></button>
</div>
<div style="height: 1px; margin: 4px 8px; background: rgba(0,0,0,0.08)"></div>
<span style="padding: 6px 10px 4px; font-size: 11px; color: #5C5952">层级</span>
<button role="menuitemradio" aria-checked="true" style="display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 10px; border: none; border-radius: 6px; background: #3D6FB6; color: #FFFFFF; font: inherit; font-size: 13px; text-align: left"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 6.2l2.3 2.3 4.7-5" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>桌面层</button>
<button role="menuitemradio" aria-checked="false" style="display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 10px 0 30px; border: none; border-radius: 6px; background: transparent; color: #1F1F1F; font: inherit; font-size: 13px; text-align: left">普通</button>
<button role="menuitemradio" aria-checked="false" style="display: flex; align-items: center; justify-content: space-between; height: 28px; padding: 0 10px 0 30px; border: none; border-radius: 6px; background: transparent; color: #1F1F1F; font: inherit; font-size: 13px; text-align: left">置顶</button>
<div style="height: 1px; margin: 4px 8px; background: rgba(0,0,0,0.08)"></div>
<button role="menuitem" style="height: 28px; padding: 0 10px 0 30px; border: none; border-radius: 6px; background: transparent; color: #1F1F1F; font: inherit; font-size: 13px; text-align: left">折叠</button>
<button role="menuitem" style="height: 28px; padding: 0 10px 0 30px; border: none; border-radius: 6px; background: transparent; color: #1F1F1F; font: inherit; font-size: 13px; text-align: left">移出停靠条</button>
<div style="height: 1px; margin: 4px 8px; background: rgba(0,0,0,0.08)"></div>
<button role="menuitem" style="height: 28px; padding: 0 10px 0 30px; border: none; border-radius: 6px; background: transparent; color: #B3261E; font: inherit; font-size: 13px; text-align: left">删除便签</button>
</div>
</div>

<div style="width: 520px; display: flex; flex-direction: column; gap: 12px">
<span style="font-size: 12px; font-weight: 600; color: #4D4A44">停靠条内拖动排序：拿起的便签放大并加深阴影，原位置留出空槽</span>
<div style="position: relative; height: 300px; border-radius: 14px; background: #7F8F86; padding: 20px; box-sizing: border-box; display: flex; gap: 12px">
<section aria-label="便签 工作" style="width: 140px; height: 180px; box-sizing: border-box; padding: 12px; border-radius: 12px; background: #E3ECF5; border: 1px solid rgba(0,0,0,0.06); box-shadow: 0 1px 2px rgba(0,0,0,0.06), 0 8px 24px rgba(0,0,0,0.10)"><h2 style="margin: 0; font-size: 13px; font-weight: 600; color: #1F1F1F">工作</h2></section>
<div style="width: 140px; height: 180px; box-sizing: border-box; border-radius: 12px; border: 1.5px dashed rgba(255,255,255,0.7); background: rgba(255,255,255,0.12)"></div>
<section aria-label="便签 读书" style="width: 140px; height: 180px; box-sizing: border-box; padding: 12px; border-radius: 12px; background: #FBE7D6; border: 1px solid rgba(0,0,0,0.06); box-shadow: 0 1px 2px rgba(0,0,0,0.06), 0 8px 24px rgba(0,0,0,0.10)"><h2 style="margin: 0; font-size: 13px; font-weight: 600; color: #1F1F1F">读书</h2></section>
<section aria-label="拖动中的便签 采购" style="position: absolute; left: 196px; top: 70px; width: 140px; height: 180px; box-sizing: border-box; padding: 12px; border-radius: 12px; background: #E2F0E8; border: 1px solid rgba(0,0,0,0.08); box-shadow: 0 4px 8px rgba(0,0,0,0.12), 0 24px 48px rgba(0,0,0,0.28); transform: scale(1.04) rotate(-1.5deg)"><h2 style="margin: 0; font-size: 13px; font-weight: 600; color: #1F1F1F">采购</h2></section>
</div>
</div>

<div style="width: 360px; display: flex; flex-direction: column; gap: 12px">
<span style="font-size: 12px; font-weight: 600; color: #4D4A44">删除后：底部提示 5 秒，可撤销</span>
<div role="status" style="display: flex; align-items: center; justify-content: space-between; gap: 16px; height: 44px; box-sizing: border-box; padding: 0 8px 0 16px; border-radius: 22px; background: #2A2A2D; box-shadow: 0 10px 30px rgba(0,0,0,0.25)">
<span style="font-size: 13px; color: #EDEDED">已删除便签「采购」</span>
<button style="height: 30px; padding: 0 14px; border: none; border-radius: 15px; background: rgba(255,255,255,0.14); color: #FFFFFF; font: inherit; font-size: 13px; font-weight: 600">撤销</button>
</div>
<span style="font-size: 12px; color: #5C5952; line-height: 1.5">同时支持 ⌘Z。提示条从底部弹入，5 秒后淡出。</span>
</div>
</div>

</div>

</body>
</html>
