<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>设置窗口</title>
<style>
body{margin:0}
a{color:#3A5A78}a:hover{color:#24405A}
</style>
<style>body{background:#DDDAD4;display:flex;justify-content:center;padding:24px}</style>
</head>
<body>


<div style="width: 760px; height: 620px; box-sizing: border-box; border-radius: 12px; overflow: hidden; background: #F4F3F0; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.10); font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif; -webkit-font-smoothing: antialiased; display: flex; flex-direction: column">

<div style="height: 44px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 16px; border-bottom: 1px solid #E2DFD9">
<span style="width: 12px; height: 12px; border-radius: 6px; background: #FF5F57"></span><span style="width: 12px; height: 12px; border-radius: 6px; background: #FEBC2E"></span><span style="width: 12px; height: 12px; border-radius: 6px; background: #28C840"></span>
<h1 style="margin: 0 0 0 16px; font-size: 13px; font-weight: 600; color: #1F1F1F">设置</h1>
</div>

<div style="flex: 1; box-sizing: border-box; padding: 20px 40px 24px; display: flex; flex-direction: column; gap: 16px">

<div style="display: flex; flex-direction: column; gap: 6px">
<h2 style="margin: 0 0 0 4px; font-size: 12px; font-weight: 600; color: #5C5952">通用</h2>
<div style="border-radius: 10px; background: #FFFFFF; box-shadow: 0 0 0 1px rgba(0,0,0,0.07)">
<div style="display: flex; align-items: center; justify-content: space-between; height: 40px; padding: 0 14px; border-bottom: 1px solid #EFEDE9">
<span id="s-login" style="font-size: 13px; color: #1F1F1F">开机时自动启动</span>
<button role="switch" aria-checked="true" aria-labelledby="s-login" style="width: 34px; height: 20px; padding: 2px; border: none; border-radius: 10px; background: #3D6FB6; display: flex; justify-content: flex-end"><span style="width: 16px; height: 16px; border-radius: 8px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(0,0,0,0.25)"></span></button>
</div>
<div style="display: flex; align-items: center; justify-content: space-between; height: 40px; padding: 0 14px">
<label for="s-rollover" style="font-size: 13px; color: #1F1F1F">每天跨天时间</label>
<select id="s-rollover" style="height: 24px; padding: 0 8px; border: 1px solid #D6D3CC; border-radius: 6px; background: #FFFFFF; font: inherit; font-size: 13px; color: #1F1F1F"><option>凌晨 4:00</option></select>
</div>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<h2 style="margin: 0 0 0 4px; font-size: 12px; font-weight: 600; color: #5C5952">停靠条</h2>
<div style="border-radius: 10px; background: #FFFFFF; box-shadow: 0 0 0 1px rgba(0,0,0,0.07)">
<div style="display: flex; align-items: center; justify-content: space-between; height: 40px; padding: 0 14px; border-bottom: 1px solid #EFEDE9">
<span style="font-size: 13px; color: #1F1F1F">停靠位置</span>
<div role="group" aria-label="停靠位置" style="display: flex; padding: 2px; border-radius: 7px; background: #EFEDE8">
<button aria-pressed="true" style="height: 22px; padding: 0 14px; border: none; border-radius: 5px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(0,0,0,0.12); font: inherit; font-size: 12px; color: #1F1F1F">顶部</button>
<button aria-pressed="false" style="height: 22px; padding: 0 14px; border: none; border-radius: 5px; background: transparent; font: inherit; font-size: 12px; color: #1F1F1F">左侧</button>
<button aria-pressed="false" style="height: 22px; padding: 0 14px; border: none; border-radius: 5px; background: transparent; font: inherit; font-size: 12px; color: #1F1F1F">右侧</button>
</div>
</div>
<div style="display: flex; align-items: center; justify-content: space-between; height: 40px; padding: 0 14px">
<label for="s-screen" style="font-size: 13px; color: #1F1F1F">显示在</label>
<select id="s-screen" style="height: 24px; padding: 0 8px; border: 1px solid #D6D3CC; border-radius: 6px; background: #FFFFFF; font: inherit; font-size: 13px; color: #1F1F1F"><option>主显示器</option></select>
</div>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<h2 style="margin: 0 0 0 4px; font-size: 12px; font-weight: 600; color: #5C5952">边缘唤出</h2>
<div style="border-radius: 10px; background: #FFFFFF; box-shadow: 0 0 0 1px rgba(0,0,0,0.07)">
<div style="display: flex; align-items: center; justify-content: space-between; height: 40px; padding: 0 14px">
<span style="font-size: 13px; color: #1F1F1F">唤出边</span>
<div role="group" aria-label="唤出边" style="display: flex; padding: 2px; border-radius: 7px; background: #EFEDE8">
<button aria-pressed="true" style="height: 22px; padding: 0 14px; border: none; border-radius: 5px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(0,0,0,0.12); font: inherit; font-size: 12px; color: #1F1F1F">自动</button>
<button aria-pressed="false" style="height: 22px; padding: 0 14px; border: none; border-radius: 5px; background: transparent; font: inherit; font-size: 12px; color: #1F1F1F">左侧</button>
<button aria-pressed="false" style="height: 22px; padding: 0 14px; border: none; border-radius: 5px; background: transparent; font: inherit; font-size: 12px; color: #1F1F1F">右侧</button>
</div>
</div>
</div>
<span style="margin-left: 4px; font-size: 12px; color: #5C5952">Dock 在屏幕底部，当前使用右侧。</span>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<h2 style="margin: 0 0 0 4px; font-size: 12px; font-weight: 600; color: #5C5952">快捷键</h2>
<div style="border-radius: 10px; background: #FFFFFF; box-shadow: 0 0 0 1px rgba(0,0,0,0.07)">
<div style="display: flex; align-items: center; justify-content: space-between; height: 40px; padding: 0 14px">
<span style="font-size: 13px; color: #1F1F1F">新建便签</span>
<button aria-label="修改新建便签快捷键，当前为 Control Option N" style="min-width: 88px; height: 24px; padding: 0 10px; border: 1px solid #D6D3CC; border-radius: 6px; background: #F7F6F3; font: inherit; font-size: 13px; color: #1F1F1F; letter-spacing: 0.08em">⌃⌥N</button>
</div>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<h2 style="margin: 0 0 0 4px; font-size: 12px; font-weight: 600; color: #5C5952">数据</h2>
<div style="border-radius: 10px; background: #FFFFFF; box-shadow: 0 0 0 1px rgba(0,0,0,0.07)">
<div style="display: flex; align-items: center; justify-content: space-between; height: 40px; padding: 0 14px">
<span style="font-size: 13px; color: #1F1F1F">备份（JSON）</span>
<div style="display: flex; gap: 8px">
<button style="height: 24px; padding: 0 12px; border: 1px solid #D6D3CC; border-radius: 6px; background: #FFFFFF; font: inherit; font-size: 13px; color: #1F1F1F">导入…</button>
<button style="height: 24px; padding: 0 12px; border: 1px solid #D6D3CC; border-radius: 6px; background: #FFFFFF; font: inherit; font-size: 13px; color: #1F1F1F">导出…</button>
</div>
</div>
</div>
</div>

</div>
</div>

</body>
</html>
