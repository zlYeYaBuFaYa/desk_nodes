<!doctype html>

<title>全屏时边缘唤出</title>
<style>

</style>
<style>body{background:#DDDAD4;display:flex;justify-content:center;padding:24px}</style>
</head>
<body>


<div style="position: relative; width: 1440px; height: 900px; overflow: hidden; background: #1E1F22; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif; -webkit-font-smoothing: antialiased">

<div style="position: absolute; inset: 0; display: flex">
<div style="width: 240px; background: #26272B; border-right: 1px solid #333438; padding: 20px 16px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px">
<div style="height: 10px; width: 70%; border-radius: 3px; background: #3A3B40"></div>
<div style="height: 10px; width: 55%; border-radius: 3px; background: #34353A"></div>
<div style="height: 10px; width: 62%; border-radius: 3px; background: #34353A"></div>
<div style="height: 10px; width: 48%; border-radius: 3px; background: #34353A"></div>
<div style="height: 10px; width: 66%; border-radius: 3px; background: #34353A"></div>
</div>
<div style="flex: 1; padding: 40px 56px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px">
<div style="height: 12px; width: 38%; border-radius: 3px; background: #4A4C55"></div>
<div style="height: 10px; width: 72%; border-radius: 3px; background: #33353B"></div>
<div style="height: 10px; width: 64%; border-radius: 3px; background: #33353B"></div>
<div style="height: 10px; width: 80%; border-radius: 3px; background: #33353B"></div>
<div style="height: 10px; width: 46%; border-radius: 3px; background: #33353B"></div>
<div style="height: 10px; width: 70%; border-radius: 3px; background: #33353B"></div>
<div style="height: 10px; width: 58%; border-radius: 3px; background: #33353B"></div>
<div style="height: 10px; width: 76%; border-radius: 3px; background: #33353B"></div>
</div>
</div>

<div style="position: absolute; right: 0; top: 180px; width: 3px; height: 540px; border-radius: 2px; background: rgba(255,255,255,0.28)"></div>

<aside aria-label="DeskNodes 唤出面板" style="position: absolute; right: 8px; top: 12px; bottom: 12px; width: 272px; box-sizing: border-box; padding: 14px 16px; border-radius: 16px; background: #F2F0EB; box-shadow: 0 0 0 1px rgba(0,0,0,0.12), 0 24px 60px rgba(0,0,0,0.45); display: flex; flex-direction: column; gap: 12px; overflow: hidden">
<div style="display: flex; align-items: center; justify-content: space-between; padding: 2px 2px 0">
<span style="font-size: 12px; font-weight: 600; color: #3F3B35; letter-spacing: 0.02em">DeskNodes</span>
<span style="font-size: 11px; color: #5F5A52">6 张便签</span>
</div>

<section aria-label="便签 今天" style="box-sizing: border-box; padding: 12px 14px; border-radius: 12px; background: #F6F1E7; border: 1px solid rgba(0,0,0,0.07)">
<div style="display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 4px"><h2 style="margin: 0; font-size: 13px; font-weight: 600; color: #1F1F1F">今天</h2><span style="font-size: 11px; color: #5F5A52; font-variant-numeric: tabular-nums">1 / 4</span></div>
<div style="display: flex; align-items: center; gap: 9px; height: 26px"><button aria-label="取消完成" style="flex: none; width: 16px; height: 16px; padding: 0; border: none; border-radius: 50%; background: rgba(31,31,31,0.72); display: flex; align-items: center; justify-content: center"><svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 5.2l2 2 4-4.4" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg></button><span style="font-size: 13px; color: #6F6A61; text-decoration: line-through">回复评审邮件</span></div>
<div style="display: flex; align-items: center; gap: 9px; height: 26px"><button aria-label="标记完成" style="flex: none; width: 16px; height: 16px; padding: 0; border: 1.5px solid rgba(31,31,31,0.42); border-radius: 50%; background: transparent"></button><span style="font-size: 13px; color: #1F1F1F">确认周会议程</span></div>
<div style="display: flex; align-items: center; gap: 9px; height: 26px"><button aria-label="标记完成" style="flex: none; width: 16px; height: 16px; padding: 0; border: 1.5px solid rgba(31,31,31,0.42); border-radius: 50%; background: transparent"></button><span style="font-size: 13px; color: #1F1F1F">取快递</span></div>
<div style="display: flex; align-items: center; gap: 9px; height: 26px"><button aria-label="标记完成" style="flex: none; width: 16px; height: 16px; padding: 0; border: 1.5px solid rgba(31,31,31,0.42); border-radius: 50%; background: transparent"></button><span style="font-size: 13px; color: #1F1F1F">给妈妈打电话</span></div>
</section>

<section aria-label="便签 本周（置顶）" style="box-sizing: border-box; padding: 12px 14px; border-radius: 12px; background: #F7E1E4; border: 1px solid rgba(0,0,0,0.07)">
<div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px">
<div style="display: flex; align-items: center; gap: 6px"><svg width="12" height="12" viewBox="0 0 12 12" role="img" aria-label="已置顶"><path d="M4.2 1.5h3.6l-.6 3.2 1.8 1.6H3l1.8-1.6z M6 6.3v4.2" fill="none" stroke="#7A4650" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"></path></svg><h2 style="margin: 0; font-size: 13px; font-weight: 600; color: #1F1F1F">本周</h2></div>
<span style="font-size: 11px; color: #6E4E54; font-variant-numeric: tabular-nums">1 / 3</span>
</div>
<div style="display: flex; align-items: center; gap: 9px; height: 26px"><button aria-label="标记完成" style="flex: none; width: 16px; height: 16px; padding: 0; border: 1.5px solid rgba(31,31,31,0.42); border-radius: 50%; background: transparent"></button><span style="font-size: 13px; color: #1F1F1F">周五前交方案初稿</span></div>
<div style="display: flex; align-items: center; gap: 9px; height: 26px"><button aria-label="取消完成" style="flex: none; width: 16px; height: 16px; padding: 0; border: none; border-radius: 50%; background: rgba(31,31,31,0.72); display: flex; align-items: center; justify-content: center"><svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 5.2l2 2 4-4.4" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg></button><span style="font-size: 13px; color: #6E5A5D; text-decoration: line-through">续费域名</span></div>
<div style="display: flex; align-items: center; gap: 9px; height: 26px"><button aria-label="标记完成" style="flex: none; width: 16px; height: 16px; padding: 0; border: 1.5px solid rgba(31,31,31,0.42); border-radius: 50%; background: transparent"></button><span style="font-size: 13px; color: #1F1F1F">周末去爬山</span></div>
</section>

<section aria-label="便签 工作" style="box-sizing: border-box; padding: 12px 14px; border-radius: 12px; background: #E3ECF5; border: 1px solid rgba(0,0,0,0.07)">
<div style="display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 4px"><h2 style="margin: 0; font-size: 13px; font-weight: 600; color: #1F1F1F">工作</h2><span style="font-size: 11px; color: #4A5664; font-variant-numeric: tabular-nums">2 / 5</span></div>
<div style="display: flex; align-items: center; gap: 9px; height: 26px"><button aria-label="标记完成" style="flex: none; width: 16px; height: 16px; padding: 0; border: 1.5px solid rgba(31,31,31,0.42); border-radius: 50%; background: transparent"></button><span style="font-size: 13px; color: #1F1F1F">提交周报</span></div>
<div style="display: flex; align-items: center; gap: 9px; height: 26px"><button aria-label="取消完成" style="flex: none; width: 16px; height: 16px; padding: 0; border: none; border-radius: 50%; background: rgba(31,31,31,0.72); display: flex; align-items: center; justify-content: center"><svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 5.2l2 2 4-4.4" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg></button><span style="font-size: 13px; color: #56606B; text-decoration: line-through">修复登录页问题</span></div>
<div style="display: flex; align-items: center; gap: 9px; height: 26px"><button aria-label="标记完成" style="flex: none; width: 16px; height: 16px; padding: 0; border: 1.5px solid rgba(31,31,31,0.42); border-radius: 50%; background: transparent"></button><span style="font-size: 13px; color: #1F1F1F">和产品对齐需求</span></div>
<div style="display: flex; align-items: center; gap: 9px; height: 26px"><button aria-label="取消完成" style="flex: none; width: 16px; height: 16px; padding: 0; border: none; border-radius: 50%; background: rgba(31,31,31,0.72); display: flex; align-items: center; justify-content: center"><svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 5.2l2 2 4-4.4" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg></button><span style="font-size: 13px; color: #56606B; text-decoration: line-through">预约会议室</span></div>
</section>

<section aria-label="便签 采购" style="box-sizing: border-box; padding: 12px 14px; border-radius: 12px; background: #E2F0E8; border: 1px solid rgba(0,0,0,0.07)">
<div style="display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 4px"><h2 style="margin: 0; font-size: 13px; font-weight: 600; color: #1F1F1F">采购</h2><span style="font-size: 11px; color: #4A5E52; font-variant-numeric: tabular-nums">1 / 4</span></div>
<div style="display: flex; align-items: center; gap: 9px; height: 26px"><button aria-label="标记完成" style="flex: none; width: 16px; height: 16px; padding: 0; border: 1.5px solid rgba(31,31,31,0.42); border-radius: 50%; background: transparent"></button><span style="font-size: 13px; color: #1F1F1F">牛奶</span></div>
<div style="display: flex; align-items: center; gap: 9px; height: 26px"><button aria-label="取消完成" style="flex: none; width: 16px; height: 16px; padding: 0; border: none; border-radius: 50%; background: rgba(31,31,31,0.72); display: flex; align-items: center; justify-content: center"><svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 5.2l2 2 4-4.4" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg></button><span style="font-size: 13px; color: #546459; text-decoration: line-through">鸡蛋</span></div>
</section>
</aside>

<svg style="position: absolute; left: 1320px; top: 470px" width="18" height="26" viewBox="0 0 18 26" aria-hidden="true"><path d="M2 2v19l5-4.5 3.4 7.2 3-1.4-3.3-7H16z" fill="#FFFFFF" stroke="#111111" stroke-width="1.3" stroke-linejoin="round"></path></svg>

</div>

</body>
</html>
