<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>DeskNodes 管理面板 · 历史</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.hs-btn{border:0;background:transparent;padding:0;margin:0;cursor:pointer;font:inherit;color:inherit;display:flex;align-items:center;justify-content:center}
.hs-btn:hover{background:rgba(127,127,127,0.12)}
.hs-strike{text-decoration:line-through}
</style>
</helmet>
<div style="width: 1040px; height: 680px; box-sizing: border-box; padding: 24px; background: #D5D9DE; font-family: -apple-system, 'SF Pro Text', 'PingFang SC', 'Segoe UI Variable', 'Microsoft YaHei UI', sans-serif; color: #2F3437">
<div style="height: 100%; border-radius: 12px; background: #FBFBFA; box-shadow: 0 1px 2px rgba(0,0,0,0.06), 0 12px 32px rgba(0,0,0,0.14); display: flex; overflow: hidden">

<div style="width: 188px; flex: none; background: #F2F2F0; border-right: 1px solid rgba(0,0,0,0.06); padding: 14px 10px; box-sizing: border-box; display: flex; flex-direction: column; gap: 4px">
<div style="display: flex; gap: 8px; padding: 2px 6px 18px" aria-hidden="true">
<span style="width: 12px; height: 12px; border-radius: 50%; background: #FF5F57"></span>
<span style="width: 12px; height: 12px; border-radius: 50%; background: #FEBC2E"></span>
<span style="width: 12px; height: 12px; border-radius: 50%; background: #28C840"></span>
</div>
<a href="Main.dc.html" style="display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px; border-radius: 8px; font-size: 14px; color: #2F3437; text-decoration: none">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15.5 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V8.5L15.5 3Z"></path><path d="M15 3v6h6"></path></svg>
便签
</a>
<div style="display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px; border-radius: 8px; font-size: 14px; font-weight: 600; background: #E3EBF3; color: #2F3437">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"></rect><path d="M16 2v4M8 2v4M3 10h18"></path></svg>
历史
</div>
<div style="display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px; border-radius: 8px; font-size: 14px; color: #2F3437">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.08a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.08a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"></path></svg>
设置
</div>
</div>

<div style="flex: 1; padding: 28px 28px 24px; display: flex; flex-direction: column; gap: 18px; min-width: 0">
<div style="display: flex; align-items: center; gap: 10px">
<h1 style="margin: 0; font-size: 20px; font-weight: 600; flex: 1">2026 年 10 月</h1>
<button class="hs-btn" aria-label="上个月" style="width: 28px; height: 28px; border-radius: 6px; color: #585E64">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
</button>
<button class="hs-btn" aria-label="下个月" style="width: 28px; height: 28px; border-radius: 6px; color: #585E64">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
</button>
</div>
<div style="display: flex; gap: 24px; font-size: 13px; color: #585E64">
<span>本月完成率 <b style="color: #2F3437; font-weight: 600">78%</b></span>
<span>连续全部完成 <b style="color: #2F3437; font-weight: 600">6 天</b></span>
<span style="color: #7E848A">示例数据</span>
</div>

<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{weekdays}}" as="w" hint-placeholder-count="7">
<div style="text-align: center; font-size: 12px; color: #585E64; padding-bottom: 4px">{{w}}</div>
</sc-for>
<sc-for list="{{cells}}" as="d" hint-placeholder-count="35">
<div style="height: 44px; border-radius: 8px; background: {{d.bg}}; color: {{d.fg}}; box-shadow: {{d.ring}}; display: flex; align-items: center; justify-content: center; font-size: 13px; font-variant-numeric: tabular-nums">{{d.label}}</div>
</sc-for>
</div>

<div style="display: flex; align-items: center; gap: 14px; font-size: 12px; color: #585E64">
<span>完成率</span>
<span style="display: flex; align-items: center; gap: 5px"><span style="width: 12px; height: 12px; border-radius: 3px; background: #E6E9ED"></span>0%</span>
<span style="display: flex; align-items: center; gap: 5px"><span style="width: 12px; height: 12px; border-radius: 3px; background: #CBD7E4"></span>1–49%</span>
<span style="display: flex; align-items: center; gap: 5px"><span style="width: 12px; height: 12px; border-radius: 3px; background: #9DB3CC"></span>50–99%</span>
<span style="display: flex; align-items: center; gap: 5px"><span style="width: 12px; height: 12px; border-radius: 3px; background: #4F6E93"></span>100%</span>
</div>
</div>

<div style="width: 300px; flex: none; border-left: 1px solid rgba(0,0,0,0.06); padding: 28px 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px">
<div>
<div style="display: flex; align-items: center; gap: 8px">
<h2 style="margin: 0; font-size: 17px; font-weight: 600">10月28日 周三</h2>
<span style="font-size: 11px; padding: 1px 7px; border-radius: 9px; background: rgba(0,0,0,0.06); color: #585E64">只读</span>
</div>
<div style="margin-top: 4px; font-size: 13px; color: #585E64">完成 5 / 7</div>
</div>
<sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: {{g.titleColor}}">
<span style="width: 10px; height: 10px; border-radius: 50%; background: {{g.dot}}; border: 1.5px solid {{g.ring}}"></span>
{{g.title}}
</div>
<sc-for list="{{g.items}}" as="it" hint-placeholder-count="2">
<div style="display: flex; align-items: center; gap: 8px; padding-left: 2px">
<span style="width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid {{it.border}}; background: {{it.fill}}; box-sizing: border-box; flex: none; display: flex; align-items: center; justify-content: center">
<svg width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="opacity: {{it.op}}"><path d="M20 6 9 17l-5-5"></path></svg>
</span>
<span class="{{it.cls}}" style="font-size: 13px; color: {{it.color}}">{{it.text}}</span>
</div>
</sc-for>
</div>
</sc-for>
</div>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1040,"height":680}}'>
class Component extends DCLogic {
  renderVals() {
    const levels = [3,2,3,3,1,2,3, 3,3,2,0,3,3,2, 3,3,3,1,2,3,3, 2,3,3,3,3,3,2, 3,2,-1];
    const look = {
      '-1': { bg: 'transparent', fg: '#9AA0A6' },
      '0': { bg: '#E6E9ED', fg: '#2F3437' },
      '1': { bg: '#CBD7E4', fg: '#2F3437' },
      '2': { bg: '#9DB3CC', fg: '#1F2427' },
      '3': { bg: '#4F6E93', fg: '#FFFFFF' }
    };
    const cells = [];
    for (let i = 0; i < 3; i++) cells.push({ label: '', bg: 'transparent', fg: '#2F3437', ring: 'none' });
    levels.forEach((lv, i) => {
      const l = look[String(lv)];
      cells.push({ label: String(i + 1), bg: l.bg, fg: l.fg, ring: i + 1 === 28 ? '0 0 0 2px #FBFBFA, 0 0 0 4px #2F3437' : 'none' });
    });
    while (cells.length % 7) cells.push({ label: '', bg: 'transparent', fg: '#2F3437', ring: 'none' });
    const item = (text, done, acc, muted) => ({
      text: text,
      fill: done ? acc : 'transparent',
      border: acc,
      op: done ? 1 : 0,
      cls: done ? 'hs-strike' : '',
      color: done ? '#A3A8AD' : (muted ? '#7E848A' : '#2F3437')
    });
    return {
      weekdays: ['一', '二', '三', '四', '五', '六', '日'],
      cells: cells,
      groups: [
        { title: '工作', dot: '#E3EBF3', ring: '#6F8FB3', titleColor: '#2F3437',
          items: [ item('整理周会纪要', true, '#6F8FB3'), item('回复客户邮件', true, '#6F8FB3'), item('评审设计稿', false, '#6F8FB3') ] },
        { title: '生活', dot: '#F7E6D6', ring: '#B97A4E', titleColor: '#2F3437',
          items: [ item('交水电费', true, '#B97A4E'), item('去健身房', true, '#B97A4E') ] },
        { title: '读书会（已删除）', dot: '#ECE9E4', ring: '#A3A8AD', titleColor: '#7E848A',
          items: [ item('准备分享材料', true, '#A3A8AD', true), item('读完第 5 章', false, '#A3A8AD', true) ] }
      ]
    };
  }
}
</script>
</body>
</html>
