<title>DeskNodes 改版原型</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: page header, then a scaled 1440×860pt desktop stage beside a requirement list. Tokens follow DesignTokens.swift / Theme.swift. */
:root{
  --bg:#f1f0ec;--panel:#fbfaf8;--ink:#1f1f1f;--sub:#5f5a52;--faint:#8a857c;--line:#dcdad3;--quiet:#e9e7e1;
  --accent:#6e9a68;--cbb:rgba(31,31,31,.42);--complete:#6f6a61;--hair:rgba(0,0,0,.08);--nborder:rgba(0,0,0,.06);
  --desk1:#b9c3bb;--desk2:#8e9c97;--desk3:#d8d3c4;
  --toolbar:#f6f5f1;--tink:#24282d;--tsub:#5c636b;--tline:#d1d2ce;
  --menu:#f2f1ee;--menuline:rgba(0,0,0,.12);--hi:#2f6fd6;--hiink:#ffffff;--danger:#d23b2f;
  --plan:#2f6f8f;--pend:#a2690f;--keep:#5b6f52;--drop:#8a857c;--warn:#b4532f;
  --overlay:rgba(16,20,18,.10);--shadow:0 5px 16px rgba(0,0,0,.09);--lift:0 18px 40px rgba(0,0,0,.22);
  --legacy-sel:#8fb487;
  --paper:#f6f1e7;--lemon:#faf0c8;--apricot:#fbe7d6;--cherry:#f7e1e4;--lavender:#ece6f5;--mist:#e3ecf5;--mint:#e2f0e8;
  --paper-s:#b59e74;--lemon-s:#c9a93a;--apricot-s:#d9905f;--cherry-s:#cf7f90;--lavender-s:#9a82c9;--mist-s:#6f97c4;--mint-s:#6fa585;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1c1d1c;--panel:#242523;--ink:#edebe6;--sub:#b3ada2;--faint:#8e897f;--line:#3d3e3a;--quiet:#2e2f2c;
  --accent:#8db887;--cbb:rgba(237,235,230,.5);--complete:#a39d92;--hair:rgba(255,255,255,.10);--nborder:rgba(255,255,255,.08);
  --desk1:#2c3530;--desk2:#1b2220;--desk3:#3a3529;
  --toolbar:#272a2e;--tink:#f2f4f6;--tsub:#bdc4cc;--tline:#50555c;
  --menu:#2c2d30;--menuline:rgba(255,255,255,.12);--hi:#3a7be0;--hiink:#ffffff;--danger:#ff6b5e;
  --plan:#6fb2d4;--pend:#e0a84a;--keep:#9cb98f;--drop:#8e897f;--warn:#e58a65;
  --overlay:rgba(0,0,0,.22);--shadow:0 5px 16px rgba(0,0,0,.35);--lift:0 18px 40px rgba(0,0,0,.5);
  --legacy-sel:#8db887;
  --paper:#2b2822;--lemon:#35301a;--apricot:#3a2a20;--cherry:#3a2328;--lavender:#2a2536;--mist:#1f2a36;--mint:#1e2e26;
  --paper-s:#c4b08a;--lemon-s:#d6be5c;--apricot-s:#e0a47e;--cherry-s:#db98a6;--lavender-s:#b5a2de;--mist-s:#92b4da;--mint-s:#8fc4a3;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1c1d1c;--panel:#242523;--ink:#edebe6;--sub:#b3ada2;--faint:#8e897f;--line:#3d3e3a;--quiet:#2e2f2c;
  --accent:#8db887;--cbb:rgba(237,235,230,.5);--complete:#a39d92;--hair:rgba(255,255,255,.10);--nborder:rgba(255,255,255,.08);
  --desk1:#2c3530;--desk2:#1b2220;--desk3:#3a3529;
  --toolbar:#272a2e;--tink:#f2f4f6;--tsub:#bdc4cc;--tline:#50555c;
  --menu:#2c2d30;--menuline:rgba(255,255,255,.12);--hi:#3a7be0;--hiink:#ffffff;--danger:#ff6b5e;
  --plan:#6fb2d4;--pend:#e0a84a;--keep:#9cb98f;--drop:#8e897f;--warn:#e58a65;
  --overlay:rgba(0,0,0,.22);--shadow:0 5px 16px rgba(0,0,0,.35);--lift:0 18px 40px rgba(0,0,0,.5);
  --legacy-sel:#8db887;
  --paper:#2b2822;--lemon:#35301a;--apricot:#3a2a20;--cherry:#3a2328;--lavender:#2a2536;--mist:#1f2a36;--mint:#1e2e26;
  --paper-s:#c4b08a;--lemon-s:#d6be5c;--apricot-s:#e0a47e;--cherry-s:#db98a6;--lavender-s:#b5a2de;--mist-s:#92b4da;--mint-s:#8fc4a3;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 32px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--hi);outline-offset:2px}
.page{max-width:1680px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header.top{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:flex-end;justify-content:space-between}
.eyebrow{font-size:11px;letter-spacing:.14em;color:var(--sub);margin-bottom:6px}
h1{font-size:22px;margin:0 0 4px;letter-spacing:-.3px;text-wrap:balance}
.lede{margin:0;color:var(--sub);font-size:13px;line-height:1.6;max-width:68ch}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;background:var(--quiet);border:1px solid var(--line);border-radius:8px;padding:2px}
.seg button{border:0;background:transparent;padding:5px 12px;border-radius:6px;font-size:12px;color:var(--sub)}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12);font-weight:600}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 12px;font-size:12px}
.btn:hover{background:var(--quiet)}
label.chk{display:inline-flex;gap:6px;align-items:center;font-size:12px;color:var(--sub)}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:20px;align-items:start}
@media (max-width:1000px){.layout{grid-template-columns:minmax(0,1fr)}}
.stage-col{min-width:0;display:flex;flex-direction:column;gap:8px}
.hint{font-size:12px;color:var(--sub);line-height:1.6}
.hint kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;background:var(--panel)}

/* Stage: logical points, scaled to the column. */
.wrap{position:relative;width:100%;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--desk2)}
.stage{position:absolute;left:0;top:0;width:1440px;height:860px;transform-origin:0 0;overflow:hidden;user-select:none;-webkit-user-select:none;
  background:radial-gradient(1100px 700px at 75% 20%,var(--desk3),transparent 60%),linear-gradient(160deg,var(--desk1),var(--desk2));--k:1;touch-action:none}
.menubar{position:absolute;left:0;top:0;right:0;height:24px;background:color-mix(in srgb,var(--toolbar) 82%,transparent);backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-size:13px;z-index:80;color:var(--tink)}
.menubar .l{display:flex;gap:18px}.menubar .l b{font-weight:600}
.menubar .r{display:flex;gap:16px;align-items:center;color:var(--tsub);font-variant-numeric:tabular-nums}
.selayer{position:absolute;left:0;right:0;top:24px;bottom:0;background:var(--overlay);z-index:2}

.note{position:absolute;z-index:5;display:flex;flex-direction:column;border-radius:13px;background:var(--nb);border:1px solid var(--nborder);box-shadow:var(--shadow);overflow:hidden;color:var(--ink);
  transition:left .26s cubic-bezier(.2,.8,.2,1),top .26s cubic-bezier(.2,.8,.2,1),width .26s cubic-bezier(.2,.8,.2,1),height .26s cubic-bezier(.2,.8,.2,1),opacity .18s,transform .18s,border-color .15s,box-shadow .15s}
.note.entering{opacity:0;transform:scale(.97)}
.note.leaving{opacity:0;transform:scale(.95)}
.note.dragging{transition:opacity .18s;z-index:30;box-shadow:var(--lift)}
.note.selected{border-color:var(--ns);box-shadow:0 0 0 .5px var(--ns),var(--shadow)}
.note.selected.inactive{border-color:color-mix(in srgb,var(--ns) 45%,transparent);box-shadow:var(--shadow)}
.note.picked{border-color:var(--hi);box-shadow:0 0 0 1px var(--hi),var(--shadow)}
.nh{position:relative;flex:none;height:calc(50px*var(--k));cursor:grab}
.grip{position:absolute;left:50%;top:5px;transform:translateX(-50%);color:var(--faint);line-height:0}
.nt{position:absolute;left:18px;right:96px;bottom:calc(6px*var(--k));font-size:calc(16px*var(--k));font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nt.ph{color:var(--faint);font-weight:500}
.nc{position:absolute;right:18px;bottom:calc(8px*var(--k));font-size:calc(12px*var(--k));color:var(--sub);font-variant-numeric:tabular-nums}
.more{position:absolute;right:8px;top:3px;border:0;background:transparent;border-radius:6px;padding:2px 6px;color:var(--sub);line-height:0}
.more:hover{background:var(--hair)}
.rows{flex:1;min-height:0;overflow:auto;padding:2px 18px 0}
.row{display:flex;align-items:center;gap:calc(11px*var(--k));min-height:calc(32px*var(--k));font-size:calc(14px*var(--k));line-height:calc(22px*var(--k))}
.cb{flex:none;width:calc(16px*var(--k));height:calc(16px*var(--k));border-radius:50%;border:1.5px solid var(--cbb);background:transparent;padding:0;display:grid;place-items:center}
.row.done .cb{background:var(--accent);border-color:var(--accent)}
.row.done .cb::after{content:"";width:35%;height:60%;border:solid var(--panel);border-width:0 2px 2px 0;transform:translateY(-10%) rotate(45deg)}
.row.done span{color:var(--complete);text-decoration:line-through}
.nf{flex:none;height:calc(44px*var(--k));margin:0 18px;border-top:1px solid var(--hair);display:flex;align-items:center}
.add{border:0;background:transparent;padding:0;color:var(--sub);font-size:calc(13px*var(--k))}
.note.collapsed{border-radius:10px}
.note.collapsed .nh{height:32px}.note.collapsed .grip,.note.collapsed .rows,.note.collapsed .nf{display:none}
.note.collapsed .nt{bottom:7px;font-size:13px}.note.collapsed .nc{bottom:9px}
.pick{display:none;position:absolute;left:8px;top:8px;width:22px;height:22px;border-radius:50%;border:1.5px solid color-mix(in srgb,var(--ink) 45%,transparent);background:var(--panel);box-shadow:0 1px 3px rgba(0,0,0,.2)}
.note.selecting .pick{display:block}
.note.selecting .nh{cursor:default}
.note.picked .pick{background:var(--hi);border-color:var(--hi)}
.note.picked .pick::after{content:"";position:absolute;left:7px;top:3px;width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}

.anno{position:absolute;z-index:3;border:1.5px dashed var(--plan);border-radius:18px;pointer-events:none}
.anno-tag{position:absolute;z-index:46;pointer-events:none;background:var(--plan);color:#fff;border-radius:10px;padding:6px 10px;font-size:13px;line-height:1.45;white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.18)}
.anno-tag small{display:block;font-size:11px;opacity:.88}
.gap{position:absolute;z-index:2;border:1.5px dashed var(--warn);border-radius:10px;display:grid;place-items:center;color:var(--warn);font-size:13px;font-weight:600;pointer-events:none;
  background:repeating-linear-gradient(45deg,color-mix(in srgb,var(--warn) 16%,transparent) 0 6px,transparent 6px 12px)}
.tabs{position:absolute;z-index:4;display:flex;flex-direction:column;gap:4px;padding:6px;border-radius:12px;background:color-mix(in srgb,var(--toolbar) 88%,transparent);border:1px solid var(--tline);overflow:auto}
.tabs.h{flex-direction:column}
.tabchip{border:1px solid var(--tline);background:var(--nb);border-radius:7px;padding:4px 8px;font-size:12px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.tb{position:absolute;z-index:40;background:var(--toolbar);color:var(--tink);border:1px solid var(--tline);border-radius:32px;box-shadow:0 6px 20px rgba(0,0,0,.12);display:flex;flex-direction:column;align-items:center;padding:16px 6px;
  transition:left .26s,top .26s,width .26s,height .26s}
.tb.h{flex-direction:row;padding:6px 16px}
.tb .grip2{flex:none;height:24px;width:100%;display:grid;place-items:center;color:var(--tsub)}
.tb.h .grip2{width:24px;height:100%}
.tool{position:relative;flex:none;width:52px;height:52px;border:0;background:transparent;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:500;color:var(--tink)}
.tb.h .tool{width:60px}
.tool:hover{background:var(--hair)}
.tool.on{background:color-mix(in srgb,var(--hi) 18%,transparent);color:var(--hi)}
.tool .dot{position:absolute;right:8px;top:7px;width:7px;height:7px;border-radius:50%;background:var(--pend)}
.tool svg{width:19px;height:19px}
.tcount{flex:none;height:32px;display:grid;place-items:center;font-size:11px;color:var(--tsub);font-variant-numeric:tabular-nums}
.tb.h .tcount{width:68px;height:100%}

.menu{position:absolute;z-index:60;width:236px;padding:5px;background:var(--menu);border:1px solid var(--menuline);border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,.24);font-size:13px;color:var(--ink)}
.mi{position:relative;display:flex;align-items:center;justify-content:space-between;width:100%;border:0;background:transparent;text-align:left;padding:4px 10px 4px 26px;border-radius:5px;min-height:26px}
.mi:hover,.mi:focus-visible,.mi.has:focus-within{background:var(--hi);color:var(--hiink);outline:none}
.mi .ck{position:absolute;left:9px;font-style:normal}
.mi.dis{opacity:.4;pointer-events:none}
.mi.danger{color:var(--danger)}.mi.danger:hover{color:var(--hiink)}
.mi em{font-style:normal;font-size:11px;background:var(--warn);color:#fff;border-radius:4px;padding:1px 5px}
.mi .arrow{font-size:11px;opacity:.7}
.sub{display:none;position:absolute;left:calc(100% + 4px);top:-5px;width:150px;padding:5px;background:var(--menu);border:1px solid var(--menuline);border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,.24);color:var(--ink)}
.menu.flip .sub{left:auto;right:calc(100% + 4px)}
.mi.has:hover>.sub,.mi.has:focus-within>.sub{display:block}
.sep{height:1px;background:var(--menuline);margin:5px 8px}
.sw{display:flex;gap:6px;padding:6px 8px 4px}
.swatch{width:24px;height:24px;border-radius:50%;border:.5px solid color-mix(in srgb,var(--ink) 30%,transparent);padding:0}
.swatch.on{border:2px solid color-mix(in srgb,var(--ink) 60%,transparent)}

.capsule{position:absolute;left:50%;transform:translateX(-50%);z-index:70;display:flex;align-items:center;gap:4px;padding:6px 8px 6px 16px;border-radius:14px;
  background:color-mix(in srgb,var(--menu) 94%,transparent);backdrop-filter:blur(14px);border:.5px solid var(--menuline);box-shadow:0 8px 24px rgba(0,0,0,.2);font-size:14px;white-space:nowrap;overflow:hidden}
.selbar{bottom:28px}
.capsule .vr{width:1px;height:22px;background:var(--menuline);margin:0 6px}
.capsule button{border:0;background:transparent;padding:6px 12px;border-radius:8px;font-size:14px}
.capsule button:hover:not(:disabled){background:var(--hair)}
.capsule button:disabled{opacity:.4;cursor:default}
.capsule .danger{color:var(--danger);font-weight:600}
.capsule .link{color:var(--hi);font-weight:600}
.toast{bottom:28px}.toast.raised{bottom:92px}
.toast .bar{position:absolute;left:0;bottom:0;height:2px;background:var(--hi);width:100%;transform-origin:left}
.toast .bar.run{animation:shrink 5s linear forwards}
@keyframes shrink{to{transform:scaleX(0)}}
.marquee{position:absolute;z-index:45;border:1px solid var(--hi);background:color-mix(in srgb,var(--hi) 14%,transparent);pointer-events:none}
.marquee.finder{border:1px solid color-mix(in srgb,var(--panel) 85%,transparent);background:color-mix(in srgb,var(--panel) 22%,transparent);border-radius:2px}
.cursor{position:absolute;z-index:90;pointer-events:none;width:22px;height:30px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.35))}
.cursor .key{position:absolute;left:22px;top:24px;font:600 13px var(--sans);background:var(--ink);color:var(--panel);border-radius:6px;padding:2px 7px;opacity:0;transform:scale(.7);transition:opacity .15s,transform .15s}
.cursor.cmd .key{opacity:1;transform:none}

.win{position:absolute;z-index:50;left:50%;top:64px;transform:translateX(-50%);width:680px;max-height:770px;display:flex;flex-direction:column;background:var(--bg);border:1px solid var(--line);border-radius:12px;box-shadow:0 24px 60px rgba(0,0,0,.3);overflow:hidden;color:var(--ink);font-size:13px}
.win .tbar{flex:none;height:38px;display:flex;align-items:center;gap:8px;padding:0 14px;border-bottom:1px solid var(--line);background:var(--panel)}
.lights{display:flex;gap:7px}.lights i{width:12px;height:12px;border-radius:50%;background:#ff5f57}.lights i:nth-child(2){background:#febc2e}.lights i:nth-child(3){background:#28c840}
.lights button{width:12px;height:12px;border-radius:50%;background:#ff5f57;border:0;padding:0}
.win .ttl{flex:1;text-align:center;font-weight:600;margin-right:48px}
.win .body{overflow:auto;padding:16px 36px 24px;display:flex;flex-direction:column;gap:6px}
.grp-t{font-size:12px;font-weight:600;color:var(--sub);margin:10px 0 4px 4px;display:flex;gap:8px;align-items:center}
.grp{background:var(--panel);border:1px solid var(--line);border-radius:10px}
.srow{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:42px;padding:6px 14px}
.srow+.srow{border-top:1px solid var(--line)}
.note-t{font-size:12px;color:var(--sub);padding:4px 4px 0;line-height:1.55}
.sseg{display:inline-flex;background:var(--quiet);border-radius:7px;padding:2px}
.sseg button{border:0;background:transparent;padding:4px 11px;border-radius:5px;font-size:12px}
.sseg button.on{background:var(--panel);box-shadow:0 1px 2px rgba(0,0,0,.14);font-weight:600}
.badge{font-size:10.5px;font-weight:600;border-radius:4px;padding:1px 6px;color:#fff;background:var(--plan)}
.badge.warn{background:var(--warn)}
.gone{border:1.5px dashed var(--warn);border-radius:10px;padding:10px 14px;font-size:12.5px;line-height:1.6;color:var(--sub);background:color-mix(in srgb,var(--warn) 7%,transparent)}
.preview{border-radius:9px;background:var(--lavender);border:1px solid var(--nborder);padding:10px 14px;display:flex;align-items:center;gap:calc(11px*var(--k));font-size:calc(14px*var(--k))}
.preview .cb{pointer-events:none}
.kbd{font-family:var(--mono);font-size:12px;color:var(--sub)}
.fake{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:3px 10px;font-size:12px}

/* Requirement list */
aside{display:flex;flex-direction:column;gap:10px;min-width:0}
.sec-t{font-size:12px;letter-spacing:.08em;color:var(--sub);margin:6px 2px 0;font-weight:600}
.req{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:7px}
.req.active{border-color:var(--plan);box-shadow:0 0 0 1px var(--plan)}
.req h3{margin:0;font-size:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.req p{margin:0;font-size:12.5px;line-height:1.65;color:var(--sub)}
.req ul{margin:0;padding-left:18px;font-size:12.5px;line-height:1.65;color:var(--sub)}
.req .acts{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:11px;font-weight:600;border-radius:99px;padding:2px 8px;border:1px solid currentColor}
.chip.plan{color:var(--plan)}.chip.pend{color:var(--pend)}.chip.info{color:var(--keep)}.chip.keep{color:var(--keep)}.chip.drop{color:var(--drop)}
.mini{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--sub);line-height:1.55}
.mini li{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.mini b{color:var(--ink);font-weight:600}
@media (prefers-reduced-motion:reduce){.note,.tb{transition:none!important}.toast .bar.run{animation:none}}
</style>

<div class="page">
  <header class="top">
    <div>
      <div class="eyebrow">DESKNODES · 2026-11 改版提案</div>
      <h1>改版交互原型</h1>
      <p class="lede">舞台按真实尺寸（1440×860pt 屏幕）缩放，可以直接拖动、点选和使用快捷键。用顶部开关对比“现状”和“改版后”；右侧每条需求都有“演示”按钮。</p>
    </div>
    <div class="controls">
      <div class="seg" role="group" aria-label="版本">
        <button id="v-new" class="on" data-ver="new">改版后</button>
        <button id="v-old" data-ver="old">现状</button>
      </div>
      <label class="chk"><input type="checkbox" id="labels" checked> 显示讲解标注</label>
      <button class="btn" id="reset">重置示例</button>

<script>
(() => {

  peek: '<path d="M4 14h12M10 3v8M6.5 6.5 10 3l3.5 3.5"/>',
  arrange: '<rect x="3.5" y="3.5" width="5" height="5" rx="1"/><rect x="11.5" y="3.5" width="5" height="5" rx="1"/><rect x="3.5" y="11.5" width="5" height="5" rx="1"/><rect x="11.5" y="11.5" width="5" height="5" rx="1"/>',
  gather: '<path d="M4 4l4 4M16 4l-4 4M4 16l4-4M16 16l-4-4"/>',
  select: '<circle cx="10" cy="10" r="6.5"/><path d="M7 10.2l2 2 4-4.2"/>',
  settings: '<circle cx="10" cy="10" r="2.6"/><path d="M10 2.8v2.2M10 15v2.2M2.8 10H5M15 10h2.2M4.9 4.9l1.6 1.6M13.5 13.5l1.6 1.6M4.9 15.1l1.6-1.6M13.5 6.5l1.6-1.6"/>'

const svg = k => `<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${ICON[k]}</svg>`;

let state, seq, scale = 1;
const els = new Map(), leaving = new Set();

function mk(id, title, color, items, extra) {

    items: items.map(t => ({ t, done: false })) }, extra);
}
function initial() {
  seq = 10;
  const notes = [
    mk(1, '今天', 'paper', ['早上去吃肠粉', '8 点半上班', '中午回家做饭', '2 点上班', '5 点下班', '吃晚饭', '给妈妈打电话'], { dock: 'left' }),
    mk(2, '电话回访', 'mist', ['回电王经理'], { dock: 'left' }),
    mk(3, '', 'lavender', [''], { x: 470, y: 96 }),
    mk(4, '购物', 'mint', ['牛奶', '鸡蛋', '洗衣液'], { x: 800, y: 72 }),
    mk(5, '本周', 'apricot', ['周报', '季度复盘材料', '预约体检', '修自行车'], { x: 470, y: 330 }),
    mk(6, '读书', 'cherry', ['《置身事内》第 3 章', '整理读书笔记'], { x: 800, y: 300 })
  ];
  notes[0].items[0].done = true;
  return { notes, legacy: false, labels: true, textSize: '标准', newW: 288, newH: 240, orientation: 'vertical', sideWide: true,
    sel: null, inactive: false, selecting: false, multi: new Set(), menu: null, settings: false, gaps: [], active: null, undo: null };
}
state = initial();
const find = id => state.notes.find(n => n.id === id);

/* Geometry */
const kf = () => state.legacy ? 1 : KS[state.textSize];
const contentH = n => Math.min(480, Math.round((50 + Math.max(1, n.items.length) * 32 + 44 + 10) * kf()));
const shownH = n => n.collapsed ? 32 : (n.h ?? contentH(n));
const sideW = () => (state.legacy || !state.sideWide) ? 240 : 288;
function dockLayout(edge) {
  const list = state.notes.filter(n => n.dock === edge).sort((a, b) => a.order - b.order);
  if (!list.length) return null;
  const hz = edge === 'top', w = hz ? 220 : sideW(), gap = 12;
  const hOf = n => n.collapsed ? 32 : (hz ? 260 : Math.min(AV.h, contentH(n)));
  const ext = n => hz ? w : hOf(n);
  const limit = hz ? AV.w : AV.h;
  const total = list.reduce((a, n) => a + ext(n), 0) + gap * (list.length - 1);
  const over = total > limit, rail = 96, budget = over ? limit - rail - gap : limit;
  const ord = [...list], si = ord.findIndex(n => n.id === state.sel);
  if (si > 0) ord.unshift(ord.splice(si, 1)[0]);
  const x0 = hz ? 0 : (edge === 'left' ? AV.x : AV.x + AV.w - w);
  const slots = [], spill = [];
  let cur = 0, full = false;
  for (const n of ord) {
    const e = ext(n);
    if (!full && cur + e <= budget) { slots.push({ n, f: { x: hz ? AV.x + cur : x0, y: hz ? AV.y : AV.y + cur, w, h: hOf(n) } }); cur += e + gap; }
    else { full = true; spill.push(n); }
  }
  const overflow = list.filter(n => spill.includes(n));
  const tabs = overflow.length ? (hz ? { x: AV.x + AV.w - rail, y: AV.y, w: rail, h: 260 } : { x: x0, y: AV.y + AV.h - rail, w, h: rail }) : null;
  const used = Math.max(0, cur - gap);
  const bounds = hz ? { x: AV.x, y: AV.y, w: over ? AV.w : used, h: 260 } : { x: x0, y: AV.y, w, h: over ? AV.h : used };
  return { edge, w, slots, overflow, tabs, bounds, count: list.length };
}
function frames() {
  const m = new Map(), docks = [];
  for (const e of ['left', 'top', 'right']) {
    const L = dockLayout(e); if (!L) continue;
    docks.push(L);
    L.slots.forEach(s => m.set(s.n.id, { ...s.f, dock: e }));
    L.overflow.forEach(n => m.set(n.id, { hidden: true }));
  }
  for (const n of state.notes) if (!n.dock) m.set(n.id, { x: n.x, y: n.y, w: n.w, h: shownH(n) });
  return { m, docks };
}
function tools() {
  const t = [['new', '新建'], ['peek', '浮起'], ['arrange', '整理'], ['gather', '收起']];
  t.push(['settings', '设置']);
  return t;
}
function tbFrame() {
  const c = tools().length;
  if (state.orientation === 'vertical') return { x: W - 8 - 64, y: 150, w: 64, h: 32 + 24 + c * 52 + 32 };
  const w = 32 + 24 + c * 60 + 68;
  return { x: Math.round((W - w) / 2), y: H - 8 - 64, w, h: 64 };
}
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* Rendering */
function noteHTML(n) {
  const done = n.items.filter(i => i.done).length;
  return `<div class="nh"><span class="grip">${GRIP}</span><span class="nt ${n.title ? '' : 'ph'}">${esc(n.title || '标题')}</span>`
    + `<span class="nc">${done} / ${n.items.length}</span><button class="more" data-act="more" aria-label="更多">${DOTS}</button></div>`
    + `<div class="rows">${n.items.map((it, i) => `<div class="row ${it.done ? 'done' : ''}"><button class="cb" data-act="check" data-i="${i}" aria-label="完成"></button><span>${esc(it.t)}</span></div>`).join('')}</div>`
    + `<div class="nf"><button class="add" data-act="add">＋ 添加事项</button></div><span class="pick" aria-hidden="true"></span>`;
}
function renderNotes(fr) {
  const layer = $('#notes'), ids = new Set(state.notes.map(n => n.id));
  for (const [id, el] of els) if (!ids.has(id)) { el.remove(); els.delete(id); }
  for (const n of state.notes) {
    let el = els.get(n.id), fresh = false;
    if (!el) {
      el = document.createElement('div'); el.className = 'note entering'; el.dataset.id = n.id;
      layer.appendChild(el); els.set(n.id, el); fresh = true;
    }
    const f = fr.m.get(n.id), d = n._drag;
    if (!f || f.hidden) { el.hidden = true; continue; }
    el.hidden = false;
    const r = d || f;
    el.style.left = r.x + 'px'; el.style.top = r.y + 'px'; el.style.width = r.w + 'px'; el.style.height = r.h + 'px';

    c.toggle('selected', !state.selecting && state.sel === n.id);
    c.toggle('inactive', state.inactive && !state.legacy);
    c.toggle('selecting', state.selecting);

}
function renderAnno(fr) {

    if (L.tabs) {

      tabs += `<div class="tabs ${hz ? 'h' : ''}" style="left:${L.tabs.x}px;top:${L.tabs.y}px;width:${L.tabs.w}px;height:${L.tabs.h}px">`
        + L.overflow.map(n => `<button class="tabchip" style="--nb:var(--${n.color})" data-act="tab" data-v="${n.id}">${esc(n.title || n.items[0]?.t || '标题')}</button>`).join('') + '</div>';
    }

    const b = L.bounds, pad = 6;
    h += `<div class="anno" style="left:${b.x - pad}px;top:${b.y - pad}px;width:${b.w + pad * 2}px;height:${b.h + pad * 2}px"></div>`;
    const text = `${EDGE[L.edge]}停靠条 · ${L.count} 张<small>同一条边的便签自动排成一${L.edge === 'top' ? '行' : '列'}，宽 ${L.w}pt</small><small>拖动顶部离开约 48pt → 变回自由便签</small>`;
    const pos = L.edge === 'left' ? `left:${b.x + b.w + 16}px;top:${b.y + 8}px`
      : L.edge === 'right' ? `right:${W - b.x + 16}px;top:${b.y + 8}px`
      : `left:${b.x + 8}px;top:${b.y + b.h + 16}px`;
    h += `<div class="anno-tag" style="${pos}">${text}</div>`;
  }
  for (const g of state.gaps) h += `<div class="gap" style="left:${g.x}px;top:${g.y}px;width:${g.w}px;height:${g.h}px">${g.h > 40 ? '空隙' : ''}</div>`;

}
function renderToolbar() {
  const tb = $('#tb'), f = tbFrame(), hz = state.orientation === 'horizontal';

  tb.innerHTML = `<div class="grip2">${GRIP}</div>` + tools().map(([k, t]) =>
    `<button class="tool ${k === 'select' && state.selecting ? 'on' : ''} ${k === 'settings' && state.settings ? 'on' : ''}" data-act="tool" data-v="${k}" aria-label="${t}">${svg(k)}<span>${t}</span></button>`).join('')

}

  return `<button class="mi ${cls}" role="menuitem" data-act="${act}"${v ? ` data-v="${v}"` : ''}>${on ? '<i class="ck">✓</i>' : ''}<span>${t}</span></button>`;

function renderBar() {
  const b = $('#selbar');

    + '<li><b>横向／竖向</b>：设置 → 工具条 → 排列方向，默认竖向。舞台里可以直接切换。</li>'
    + '<li><b>磁吸</b>：松手时离屏幕边 81pt 内就吸附，0.2 秒减速动画。</li>'
    + '<li><b>闲置收缩</b>：吸边后闲置 10／15／30 秒缩成 48pt 圆形，停留 140ms 或单击展开。</li></ul>';
  h += `<div class="sec-t">不做</div><ul class="mini">`
    + '<li><b>圆形入口悬停放大反馈</b>：已取消。</li>'
    + '<li><b>自由摆放的工具条闲置后自动飞到边缘</b>：界面不应在用户没操作时自己移动。</li></ul>';
  $('#aside').innerHTML = h;
}
const DEMOS = {
  dock() {
    if (state.selecting) exitSelect();
    state.settings = false; state.menu = null; state.labels = true; state.sel = null;
    const free = state.notes.filter(n => n.dock !== 'left');
    const want = 3 - state.notes.filter(n => n.dock === 'left').length;
    free.slice(0, Math.max(0, want)).forEach(n => dockNote(n, 'left'));
    render(); toast('左侧便签组成一条停靠条。拖住其中一张的顶部往右拉，就能拖出来');
  },
  menu() {
    if (state.selecting) exitSelect();
    state.settings = false;
    const fr = frames().m, n = state.notes.find(n => !n.dock) || state.notes.find(n => !fr.get(n.id)?.hidden);
    if (!n) return toast('没有便签了，先点“重置示例”');
    state.menu = { id: n.id }; render();
  },
  outline() {
    if (state.selecting) exitSelect();
    const n = state.notes.find(n => n.color === 'lavender') || state.notes[0];
    if (!n) return toast('没有便签了，先点“重置示例”');
    state.sel = n.id; render();
  },
  inactive() { state.inactive = !state.inactive; render(); toast(state.inactive ? '应用在后台：描边减淡' : '应用在前台：描边正常'); },
  height() { createNote(); },
  arrange() { arrange(); },
  batch() { demoCmdDrag(); },
  batchMode() { enterSelect(); if (!state.legacy) toast('单击便签勾选，或从任意位置拖动画选框'); },
  text() { if (state.selecting) exitSelect(); state.settings = true; render(); $('#appearance')?.scrollIntoView({ block: 'nearest' }); },
  dockset() { if (state.selecting) exitSelect(); state.settings = true; render(); },
  width() {
    if (!state.notes.some(n => n.dock === 'left' || n.dock === 'right')) DEMOS.dock();
    state.sideWide = !state.sideWide; render();
    toast(state.legacy ? '“现状”固定 240pt，切到“改版后”对比' : `侧边停靠宽度：${sideW()}pt`);
  }
};
$('#aside').addEventListener('click', e => {
  const b = e.target.closest('[data-demo]'); if (!b) return;
  const id = b.dataset.demo;
  state.active = b.closest('.req')?.dataset.id || state.active;
  DEMOS[id]();
  renderAside();
});
document.querySelectorAll('[data-ver]').forEach(b => b.addEventListener('click', () => {
  state.legacy = b.dataset.ver === 'old';
  if (state.selecting) exitSelect();
  state.menu = null; state.gaps = [];
  render();
}));
$('#labels').addEventListener('change', e => { state.labels = e.target.checked; render(); });
$('#reset').addEventListener('click', () => {
  const legacy = state.legacy;
  els.forEach(el => el.remove()); els.clear(); leaving.clear();
  state = initial(); state.legacy = legacy;
  $('#toast').hidden = true; render();
});

/* Fit the stage to its column */
function fit() {
  const wrap = $('#wrap');
  scale = wrap.clientWidth / W;
  stage.style.transform = `scale(${scale})`;
  wrap.style.height = H * scale + 'px';
}
new ResizeObserver(fit).observe($('#wrap'));
buildAside(); fit(); render();
})();
</script>
