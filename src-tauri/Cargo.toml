[package]
name = "desk-nodes"
version = "0.1.0"
description = "DeskNodes desktop sticky notes technical prototype"
edition = "2024"

[lib]
name = "desk_nodes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "image-png", "unstable"] }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
strip = true
